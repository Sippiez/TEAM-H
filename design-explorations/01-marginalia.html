<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!--
DIRECTION CONTRACT · 01 Marginalia
THESIS: The form is the interface. Explanations are margin notes a helpful friend pencilled beside each field, tied to it by a leader line.
OWN-WORLD: Annotated proof sheet on a cool white desk. White paper, offset shadow, graphite ink, one highlighter yellow for selection. Pencil blue for links only. Atkinson Hyperlegible Next.
STORY: Land on an already annotated study copy. Drop a PDF onto the paper or open a sample. Select a field: a marker swipes across it and its note appears in the margin. Ask at the bottom when a note isn't enough.
FIRST VIEWPORT: Landing: annotated sample sheet left, headline, paper drop zone, samples, footnotes right. Workspace: clipped tabs, field index, sheet, margin note.
FORM: The facsimile stays a plain document; helper chrome lives around it.
-->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Form Helper · Marginalia</title>
<link rel="stylesheet" href="shared/form-sheet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --desk: #f3f5f7;
  --paper: #ffffff;
  --ink: #22262b;
  --ink-2: #4a525c;
  --rule: #cdd3da;
  --rule-2: #e3e7ec;
  --hl: #ffe94d;
  --hl-ink: #8a6e00;
  --pencil: #2556a6;
  --font: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, sans-serif;
  --ease: cubic-bezier(0.16, 1, 0.3, 1);
  --strip-h: 56px;
  --bar-h: 64px;
  --paper-shadow: 0 1px 2px rgb(34 38 43 / 0.10), 8px 14px 28px -10px rgb(34 38 43 / 0.30);
  --paper-shadow-sm: 0 1px 1px rgb(34 38 43 / 0.08), 3px 5px 12px -6px rgb(34 38 43 / 0.30);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--desk); color: var(--ink); font: 17px/1.55 var(--font); }
h1, h2, h3, h4 { margin: 0; line-height: 1.2; text-wrap: balance; }
p { margin: 0; }
a { color: var(--pencil); text-decoration-thickness: 1px; text-underline-offset: 0.18em; }
a:hover { text-decoration-thickness: 2px; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; border-radius: 3px; }
.sr { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.hl { background: linear-gradient(transparent 56%, var(--hl) 56%, var(--hl) 94%, transparent 94%); -webkit-box-decoration-break: clone; box-decoration-break: clone; padding: 0 3px; margin: 0 -3px; }
svg { flex: none; }

/* Buttons */
.btn { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 6px; border: 1.5px solid var(--ink); background: var(--paper); color: var(--ink); font-weight: 700; font-size: 16px; line-height: 1.2; text-align: left; cursor: pointer; }
.btn:hover { background: #eef1f4; }
.btn-hl { background: var(--hl); }
.btn-hl:hover { background: #ffdf1a; }
.btn-quiet { border-color: #8a939d; font-weight: 600; }
.btn-sm { min-height: 40px; font-size: 15px; padding: 0 12px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn:disabled:hover { background: var(--paper); }

/* Top strip */
.strip { position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 24px; min-height: var(--strip-h); padding: 8px 28px; background: var(--desk); border-bottom: 1px solid var(--rule); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 19px; letter-spacing: -0.01em; white-space: nowrap; }
.strip-note { flex: 1; display: flex; align-items: center; gap: 8px; font-size: 15px; color: var(--ink-2); }
.strip-act { display: flex; gap: 8px; }

/* Facsimile restyle: still a plain document */
body .form-sheet {
  --fs-font: var(--font);
  --fs-ink: #22262b;
  --fs-rule: #5d6670;
  --fs-bar: #22262b;
  --ff-ring: var(--hl-ink);
  --ff-tint: rgb(255 233 77 / 0.92);
  --ff-hover: rgb(255 233 77 / 0.30);
  --ff-visited-mark: #22262b;
  --ff-radius: 2px;
  overflow: visible;
}
body .form-sheet .ff:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
body .form-sheet .ff.is-selected {
  background-color: transparent;
  background-image: linear-gradient(var(--ff-tint), var(--ff-tint));
  background-repeat: no-repeat;
  background-position: left center;
  background-size: 100% 100%;
  box-shadow: inset 0 0 0 2px var(--ff-ring);
  animation: fh-swipe 250ms var(--ease) both;
}
@keyframes fh-swipe { from { background-size: 0% 100%; } to { background-size: 100% 100%; } }
body .form-sheet .ff.is-visited::after { top: 5px; right: 8px; width: 5px; height: 10px; border-radius: 0; background: none; border: solid var(--ff-visited-mark); border-width: 0 2px 2px 0; transform: rotate(45deg); }

/* Leader lines */
.leads { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; z-index: 5; }
.lead-halo { fill: none; stroke: #fff; stroke-width: 5; stroke-linecap: round; opacity: 0.9; }
.lead { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-linecap: round; }
.lead-start { fill: var(--hl); stroke: var(--ink); stroke-width: 1.5; }
.lead-end { fill: var(--ink); }

/* Sources */
.src-list { list-style: none; margin: 0; padding: 0; }
.src { display: flex; flex-direction: column; gap: 2px; padding: 8px 0; border-top: 1px solid var(--rule-2); }
.src:first-child { border-top: 0; padding-top: 2px; }
.src a { font-weight: 600; }
.src small { font-size: 15px; color: var(--ink-2); }
/* ---------- Landing ---------- */
.landing { max-width: 1440px; margin: 0 auto; padding: 36px 28px 120px; overflow-x: clip; }
.land-grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(340px, 1fr); gap: 56px; align-items: start; }
.sample { margin: 0; }
.sample-desk { position: relative; display: grid; grid-template-columns: minmax(0, 520px) minmax(240px, 300px); gap: 64px; align-items: start; }
.sample-sheet { position: relative; }
.sample-sheet::before { content: ""; position: absolute; inset: 0; background: var(--paper); border: 1px solid var(--rule-2); box-shadow: var(--paper-shadow-sm); transform: rotate(-2deg) translate(-12px, 10px); }
.sample-sheet .form-sheet { position: relative; font-size: 10.5px; box-shadow: var(--paper-shadow); }
.sample-notes { list-style: none; margin: 0; padding: 0; position: relative; }
.snote { position: absolute; left: 0; right: 0; display: flex; flex-direction: column; gap: 6px; font-size: 17px; line-height: 1.5; }
.snote-title { font-size: 18px; font-weight: 800; }
.snote-k { display: block; font-size: 15px; font-weight: 700; color: var(--ink-2); }
.snote-ex b { font-size: 18px; }
.snote .src-list { font-size: 16px; }
.sample figcaption { margin-top: 28px; max-width: 60ch; font-size: 16px; color: var(--ink-2); }

.pitch { display: flex; flex-direction: column; padding-top: 4px; }
.pitch h1 { font-size: clamp(2.1rem, 2.9vw, 2.85rem); font-weight: 800; letter-spacing: -0.02em; line-height: 1.08; }
.sub { margin-top: 16px; font-size: 19px; color: var(--ink-2); max-width: 40ch; }
.drop { position: relative; margin-top: 28px; display: flex; flex-direction: column; gap: 4px; padding: 26px 26px 24px; background: var(--paper); box-shadow: var(--paper-shadow); cursor: pointer; }
.drop::before { content: ""; position: absolute; inset: 10px; border: 1.5px dashed #8a939d; pointer-events: none; }
.drop::after { content: ""; position: absolute; top: 0; right: 0; width: 30px; height: 30px; background: linear-gradient(225deg, var(--desk) 50%, #dfe4e9 50%); box-shadow: -2px 2px 3px -1px rgb(34 38 43 / 0.15); }
.drop:hover::before, .drop.is-over::before { border-color: var(--ink); }
.drop.is-over { background: #fffbe0; }
.drop:focus-within { outline: 3px solid var(--ink); outline-offset: 3px; }
.drop-title { font-size: 22px; font-weight: 800; }
.drop-hint { color: var(--ink-2); }
.drop-btn { align-self: flex-start; margin-top: 12px; }
.limits { margin-top: 12px; font-size: 15.5px; color: var(--ink-2); }
.samples-title { margin-top: 30px; font-size: 18px; font-weight: 800; }
.samples { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
.sample-btn { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; min-height: 64px; padding: 10px 14px; text-align: left; background: var(--paper); border: 1.5px solid var(--ink); border-radius: 6px; box-shadow: var(--paper-shadow-sm); cursor: pointer; }
.sample-btn:hover { background: var(--hl); }
.sample-btn b { font-size: 15px; }
.sample-btn span { font-size: 16px; font-weight: 600; line-height: 1.3; }
.supported { margin-top: 14px; font-size: 15.5px; }
.footnotes { position: relative; margin-top: 28px; padding-top: 16px; display: flex; flex-direction: column; gap: 8px; font-size: 15.5px; line-height: 1.5; color: var(--ink-2); }
.footnotes::before { content: ""; position: absolute; top: 0; left: 0; width: 72px; border-top: 1.5px solid var(--ink); }
.footnotes strong { color: var(--ink); }

.index-sec { margin-top: 96px; padding-top: 40px; border-top: 1px solid var(--rule); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 56px; }
.index-sec h2 { font-size: 28px; font-weight: 800; letter-spacing: -0.01em; }
.index-sec .sub { font-size: 17px; margin-top: 10px; }
.svc-form { margin-top: 20px; display: flex; flex-direction: column; gap: 8px; }
.svc-form label { font-weight: 700; }
.svc-row { display: flex; gap: 8px; flex-wrap: wrap; }
.field-in { flex: 1 1 220px; min-height: 48px; padding: 0 14px; border: 1.5px solid #6b7480; border-radius: 6px; background: var(--paper); color: var(--ink); font: inherit; }
.field-in::placeholder { color: #4f5863; opacity: 1; }
.index { list-style: none; margin: 0; padding: 0; }
.index li { border-bottom: 1px solid var(--rule-2); }
.index a { display: flex; align-items: baseline; gap: 10px; min-height: 52px; padding: 12px 0; text-decoration: none; color: var(--ink); }
.ix-title { font-size: 19px; font-weight: 600; color: var(--pencil); text-decoration: underline 1px; text-underline-offset: 0.18em; }
.index a:hover .ix-title { text-decoration-thickness: 2px; }
.ix-leader { flex: 1; min-width: 24px; border-bottom: 2px dotted #9aa3ad; transform: translateY(-5px); }
.ix-dept { font-weight: 800; font-size: 16px; }
.ix-note { display: block; margin: -6px 0 10px; font-size: 15px; color: var(--ink-2); }
.ix-empty { padding: 14px 0; color: var(--ink-2); }

/* ---------- Workspace ---------- */
.ws { display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 36px; max-width: 1480px; margin: 0 auto; padding: 28px 28px calc(var(--bar-h) + 64px); align-items: start; }
.margin { position: sticky; top: calc(var(--strip-h) + 20px); max-height: calc(100vh - var(--strip-h) - var(--bar-h) - 40px); overflow: auto; display: flex; flex-direction: column; gap: 28px; padding: 12px 6px 12px 4px; }
.clips { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.clip { position: relative; width: 100%; display: flex; flex-direction: column; align-items: flex-start; gap: 0; min-height: 58px; padding: 10px 12px 10px 34px; text-align: left; background: #e6eaee; border: 1px solid var(--rule); border-radius: 6px; cursor: pointer; }
.clip:hover { background: #eef1f4; }
.clip[aria-pressed="true"] { background: var(--paper); border-color: #aeb6bf; box-shadow: var(--paper-shadow-sm); }
.clip-icon { position: absolute; top: -10px; left: 12px; width: 14px; height: 32px; color: #5d6670; }
.clip[aria-pressed="true"] .clip-icon { color: var(--ink); }
.clip-num { font-weight: 800; font-size: 16px; }
.clip[aria-pressed="true"] .clip-num { background: linear-gradient(transparent 58%, var(--hl) 58%); }
.clip-name { font-size: 15px; color: var(--ink-2); }
.docs-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.count { font-size: 15px; color: var(--ink-2); }
.add-pdf { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 12px; border: 1.5px dashed #6b7480; border-radius: 6px; font-weight: 700; font-size: 15px; cursor: pointer; }
.add-pdf:hover { background: var(--paper); border-color: var(--ink); }
.add-pdf:focus-within { outline: 3px solid var(--ink); outline-offset: 2px; }
.fields-btn { display: none; }
.toc-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.toc-head h2 { font-size: 17px; font-weight: 800; }
.toc-count { font-size: 15px; color: var(--ink-2); white-space: nowrap; }
.toc-close { display: none; }
.toc-sec + .toc-sec { margin-top: 18px; }
.toc-sec h3 { font-size: 15px; font-weight: 700; color: var(--ink-2); padding: 6px 0 4px; border-bottom: 1px solid var(--rule); margin-bottom: 4px; }
.toc ol { list-style: none; margin: 0; padding: 0; }
.toc-item { display: grid; grid-template-columns: 18px 1fr auto; gap: 8px; align-items: start; width: 100%; padding: 7px 6px; text-align: left; background: none; border: 0; border-radius: 4px; font-size: 15.5px; line-height: 1.35; cursor: pointer; }
.toc-item:hover { background: #e6eaee; }
.toc-item[aria-current="true"] { background: var(--hl); font-weight: 700; }
.tick { width: 16px; height: 16px; margin-top: 2px; display: grid; place-items: center; border: 1.5px solid #6b7480; border-radius: 3px; background: var(--paper); }
.tick.on { border-color: var(--ink); }
.toc-pg { font-size: 14px; color: var(--ink-2); white-space: nowrap; padding-top: 1px; }
.toc-item[aria-current="true"] .toc-pg { color: var(--ink); }

.desk { position: relative; display: grid; grid-template-columns: minmax(400px, 640px) minmax(280px, 1fr); gap: clamp(40px, 5vw, 72px); align-items: start; }
.sheet-col { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.ws-sheet .form-sheet { font-size: 12.5px; box-shadow: var(--paper-shadow); }
.pages { display: flex; align-items: flex-end; gap: 18px; flex-wrap: wrap; }
.pages-label { font-weight: 700; font-size: 16px; padding-bottom: 6px; white-space: nowrap; }
.pages ol { list-style: none; margin: 0; padding: 0; display: flex; gap: 6px; flex-wrap: wrap; }
.pg { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 44px; padding: 4px; background: none; border: 0; border-radius: 6px; cursor: pointer; }
.pg-thumb { position: relative; width: 36px; height: 47px; display: flex; flex-direction: column; gap: 4px; padding: 7px 6px; background: var(--paper); border: 1px solid var(--rule); box-shadow: 1px 2px 4px -1px rgb(34 38 43 / 0.25); }
.pg-thumb i { height: 3px; background: #dde2e7; }
.pg-thumb.has i { background: #9aa3ad; }
.pg-thumb i:nth-child(2n) { width: 70%; }
.pg-thumb.seen::after { content: ""; position: absolute; right: 4px; bottom: 5px; width: 5px; height: 9px; border: solid var(--ink); border-width: 0 2px 2px 0; transform: rotate(45deg); }
.pg:hover .pg-thumb { border-color: var(--ink); }
.pg[aria-current="page"] .pg-thumb { border: 2px solid var(--ink); }
.pg-n { font-size: 15px; font-weight: 700; padding: 0 6px; border-radius: 3px; }
.pg[aria-current="page"] .pg-n { background: var(--hl); }

.note-col { position: relative; min-height: 240px; }
.note { position: absolute; top: 0; left: 0; right: 0; font-size: 18px; line-height: 1.55; }
.note-head { display: flex; flex-direction: column; gap: 6px; }
.note h2 { font-size: 27px; font-weight: 800; letter-spacing: -0.01em; outline-offset: 4px; }
.note-meta { font-size: 16px; color: var(--ink-2); }
.linkish { min-height: 32px; padding: 0; background: none; border: 0; color: var(--pencil); text-decoration: underline; text-underline-offset: 0.18em; cursor: pointer; }
.note-toggle { display: none; }
.note-flags { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; margin-top: 14px; }
.flag-req { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--paper); border: 1.5px solid var(--ink); border-radius: 6px; font-size: 16px; font-weight: 700; }
.flag-src { display: flex; align-items: flex-start; gap: 8px; font-size: 16px; color: var(--ink-2); }
.flag-src svg { margin-top: 3px; }
.flag-src.is-general { color: var(--ink); font-style: italic; }
.note-actions { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; margin-top: 18px; }
.note-step { display: flex; gap: 8px; flex-wrap: wrap; }
.note-sec { margin-top: 26px; }
.note-sec h3 { font-size: 16px; font-weight: 800; margin-bottom: 6px; }
.note p { max-width: 62ch; }
.note ul { margin: 0; padding-left: 1.3em; }
.note li + li { margin-top: 6px; }
.note .pts li::marker { content: "✓  "; font-weight: 700; }
.note .mst li::marker { content: "–  "; }
.ex { display: inline-block; padding: 3px 10px; background: var(--paper); border: 1px solid var(--rule); border-radius: 4px; font-weight: 700; font-size: 19px; }
.note-empty { display: flex; gap: 12px; align-items: flex-start; font-size: 19px; color: var(--ink-2); max-width: 30ch; padding-top: 8px; }

/* Ask bar + drawer */
.ask { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; pointer-events: none; }
.ask > * { pointer-events: auto; }
.ask-bar { height: var(--bar-h); display: flex; align-items: center; gap: 12px; padding: 0 28px; background: var(--paper); border-top: 1px solid var(--rule); box-shadow: 0 -8px 20px -14px rgb(34 38 43 / 0.35); }
.ask-open { font-weight: 800; }
.ask-open svg.chev { transition: none; }
.ask-open[aria-expanded="true"] svg.chev { transform: rotate(180deg); }
.ask-prompt { flex: 0 1 520px; min-width: 0; min-height: 44px; padding: 0 14px; text-align: left; background: var(--paper); border: 1px solid #8a939d; border-radius: 6px; color: #4f5863; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: text; }
.ask-prompt:hover { border-color: var(--ink); }
.ask-drawer { position: absolute; left: 24px; bottom: calc(var(--bar-h) - 1px); width: min(640px, calc(100vw - 48px)); max-height: calc(100vh - var(--strip-h) - var(--bar-h) - 24px); display: flex; flex-direction: column; background: var(--paper); border: 1px solid var(--rule); border-bottom: 0; border-radius: 10px 10px 0 0; box-shadow: 6px -10px 32px -14px rgb(34 38 43 / 0.40); }
.ask-drawer[hidden] { display: none; }
.ask-dhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px 12px 20px; border-bottom: 1px solid var(--rule-2); }
.ask-dhead h2 { font-size: 19px; font-weight: 800; }
.icon-btn { display: inline-grid; place-items: center; width: 44px; height: 44px; padding: 0; background: none; border: 1px solid transparent; border-radius: 6px; cursor: pointer; }
.icon-btn:hover { border-color: var(--rule); background: #eef1f4; }
.ask-log { flex: 1; min-height: 140px; overflow: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 20px; font-size: 17px; }
.msg { max-width: 64ch; }
.msg-who { margin-bottom: 4px; font-size: 14.5px; font-weight: 700; color: var(--ink-2); }
.msg-user { align-self: flex-end; padding: 10px 14px; background: #eef1f4; border-radius: 10px 10px 2px 10px; }
.msg-ctx { font-size: 15px; color: var(--ink-2); }
.msg ul { margin: 6px 0 0; padding-left: 1.3em; }
.msg-ov { padding-bottom: 18px; border-bottom: 1px solid var(--rule-2); }
.msg-ov h3 { font-size: 18px; font-weight: 800; }
.msg-ov h4 { font-size: 15.5px; font-weight: 800; margin: 14px 0 2px; }
.ov-title { margin: 4px 0 8px; }
.msg .src-list { margin-top: 6px; }
.refs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.ref, .sugg { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 4px 12px; background: var(--paper); border: 1.5px solid var(--ink); border-radius: 999px; font-size: 15.5px; font-weight: 600; text-align: left; cursor: pointer; }
.sugg { border-color: #8a939d; border-width: 1px; }
.ref:hover, .sugg:hover { background: var(--hl); border-color: var(--ink); }
.msg-proto { margin-top: 8px; font-size: 14px; color: var(--ink-2); }
.is-thinking p:last-child { font-style: italic; }
.ask-sugg { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 20px 0; border-top: 1px solid var(--rule-2); }
.ctx { padding: 10px 20px 0; }
.ctx[hidden] { display: none; }
.ctx-bar { padding: 0; min-width: 0; }
.ctx-chip { display: inline-flex; align-items: center; gap: 10px; max-width: 100%; padding: 4px 4px 4px 12px; background: var(--hl); border-radius: 6px; font-size: 15.5px; }
.ctx-chip > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ctx-clear { flex: none; min-height: 36px; padding: 0 10px; background: var(--paper); border: 1.5px solid var(--ink); border-radius: 4px; font-size: 15px; font-weight: 700; cursor: pointer; }
.ask-form { display: flex; gap: 8px; padding: 10px 20px 0; }
.ask-form .field-in { flex: 1; }
.ask-form .btn[disabled] { opacity: 0.55; }
.ask-fine { display: flex; flex-direction: column; gap: 4px; padding: 10px 20px 14px; font-size: 15px; line-height: 1.45; color: var(--ink-2); }

body[data-view="workspace"] .proto-switch { bottom: auto; top: calc(var(--strip-h) + 10px); left: auto; right: 16px; transform: none; }

/* ---------- Narrower desktop ---------- */
@media (max-width: 1180px) {
  .ws { grid-template-columns: 200px minmax(0, 1fr); gap: 24px; padding-left: 20px; padding-right: 20px; }
  .land-grid { grid-template-columns: minmax(0, 1fr) 340px; gap: 40px; }
  .sample-desk { grid-template-columns: minmax(0, 1fr) 230px; gap: 40px; }
}

/* ---------- Mobile ---------- */
@media (max-width: 860px) {
  :root { --bar-h: 64px; }
  .strip { flex-wrap: wrap; gap: 6px 12px; padding: 8px 14px; }
  .strip-note { order: 3; flex-basis: 100%; }
  .strip-act { margin-left: auto; }
  .btn-sm { min-height: 44px; }

  .landing { padding: 24px 16px 120px; }
  .land-grid { grid-template-columns: 1fr; gap: 48px; }
  .pitch { order: -1; }
  .samples { grid-template-columns: 1fr; }
  .sample-desk { grid-template-columns: 1fr; gap: 24px; }
  .sample-sheet::before { transform: rotate(-1.5deg) translate(-4px, 6px); }
  .sample-sheet .form-sheet { font-size: 8.5px; }
  #sample-lines { display: none; }
  .sample-notes { height: auto !important; display: flex; flex-direction: column; gap: 22px; }
  .snote { position: static; }
  .index-sec { grid-template-columns: 1fr; gap: 20px; margin-top: 64px; }
  .index a { min-height: 56px; }

  .ws { grid-template-columns: 1fr; gap: 16px; padding: 14px 12px calc(var(--bar-h) + 150px); }
  .margin { position: static; max-height: none; overflow: visible; gap: 12px; padding: 10px 0 0; }
  .clips { flex-direction: row; }
  .clips li { flex: 1; }
  .add-pdf { min-height: 44px; }
  .fields-btn { display: inline-flex; align-self: flex-start; }
  .toc { display: none; position: fixed; inset: 0; z-index: 70; overflow: auto; padding: 14px 16px 40px; background: var(--paper); }
  body.toc-open { overflow: hidden; }
  body.toc-open .toc { display: block; }
  .toc-head { align-items: center; position: sticky; top: -14px; background: var(--paper); padding: 6px 0; }
  .toc-head h2 { font-size: 20px; flex: 1; }
  .toc-close { display: inline-grid; }
  .toc-item { min-height: 48px; align-items: center; font-size: 17px; }
  .tick { margin-top: 0; }

  .desk { grid-template-columns: 1fr; gap: 16px; }
  #ws-lines { display: none; }
  .ws-sheet .form-sheet { font-size: 12px; aspect-ratio: auto; padding: 18px 14px; }
  .ws-sheet .fs-4 { grid-template-columns: 1fr 1fr; }
  .ws-sheet .ff { min-height: 48px; }
  .pages ol { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; max-width: 100%; }
  .pages { flex-direction: column; align-items: flex-start; gap: 6px; }

  .note-col { position: static; min-height: 0 !important; }
  .note { position: fixed; top: auto !important; left: 0; right: 0; bottom: var(--bar-h); z-index: 55; max-height: calc(100dvh - var(--bar-h) - 56px); overflow: auto; padding: 8px 18px 16px; background: var(--paper); border-top: 1px solid var(--rule); border-radius: 14px 14px 0 0; box-shadow: 0 -12px 30px -14px rgb(34 38 43 / 0.45); }
  .note::before { content: ""; display: block; width: 40px; height: 4px; margin: 0 auto 8px; border-radius: 2px; background: #c4cbd3; }
  .note-head { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; }
  .note-head h2 { font-size: 20px; }
  .note-meta { font-size: 15px; grid-column: 1; }
  .note-toggle { display: inline-flex; grid-column: 2; grid-row: 1 / span 2; }
  .note-body { display: none; }
  body.note-open .note-body { display: block; }
  .note-empty { font-size: 17px; padding-top: 0; max-width: none; }

  .ask { z-index: 60; }
  .ask-bar { padding: 0 12px; gap: 8px; }
  .ask-bar .ctx-bar { display: none; }
  .ask-drawer { left: 0; right: 0; width: auto; max-height: calc(100dvh - var(--bar-h) - 40px); border-radius: 14px 14px 0 0; }
  .ask-log { padding: 14px 16px; }
  .ask-sugg, .ctx, .ask-form { padding-left: 16px; padding-right: 16px; }
  .ask-fine { padding: 10px 16px 14px; }
  .ctx-clear { min-height: 44px; }
  .ref, .sugg { min-height: 44px; }
  body[data-view="workspace"] .proto-switch { top: auto; bottom: calc(var(--bar-h) + 112px); left: 50%; right: auto; transform: translateX(-50%); }
}

@media (prefers-reduced-motion: reduce) {
  body .form-sheet .ff.is-selected { animation: none; }
  * { scroll-behavior: auto !important; }
}
</style>
</head>
<body>
<header class="strip">
  <div class="brand">
    <svg width="24" height="28" viewBox="0 0 28 32" aria-hidden="true"><rect x="3" y="2" width="22" height="28" rx="2" fill="#fff" stroke="#22262b" stroke-width="1.6"/><rect x="6" y="11.5" width="16" height="6" fill="#ffe94d"/><path d="M8 8h12M8 14.5h10M8 21h12M8 25h8" stroke="#22262b" stroke-width="1.4"/></svg>
    <span data-i18n="brand"></span>
  </div>
  <p class="strip-note">
    <svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 9v5M10 6.2v.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    <span data-i18n="notOfficial"></span>
  </p>
  <div class="strip-act">
    <button type="button" class="btn btn-quiet btn-sm" id="new-session" data-view-panel="workspace" data-i18n="newSession"></button>
    <button type="button" class="btn btn-sm" id="lang-btn" data-i18n="langName"></button>
  </div>
</header>

<!-- ================= LANDING ================= -->
<main class="landing" id="main-landing" data-view-panel="landing">
  <div class="land-grid">
    <figure class="sample">
      <div class="sample-desk" id="sample-desk">
        <div class="sample-sheet" id="sample-sheet" inert aria-hidden="true"></div>
        <ol class="sample-notes" id="sample-notes"></ol>
        <svg class="leads" id="sample-lines" aria-hidden="true"></svg>
      </div>
      <figcaption data-i18n="sampleCaption"></figcaption>
    </figure>

    <div class="pitch">
      <h1 data-i18n="heroTitle"></h1>
      <p class="sub" data-i18n="heroSub"></p>

      <label class="drop" id="drop">
        <input type="file" id="file-in" class="sr" accept="application/pdf,.pdf" multiple aria-describedby="limits">
        <svg width="34" height="38" viewBox="0 0 34 38" aria-hidden="true"><path d="M5 2h17l8 8v26H5z" fill="#fff" stroke="#22262b" stroke-width="1.6" stroke-linejoin="round"/><path d="M22 2v8h8" fill="none" stroke="#22262b" stroke-width="1.6" stroke-linejoin="round"/><path d="M17.5 16v13M12.5 24l5 5 5-5" fill="none" stroke="#22262b" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="drop-title" data-i18n="uploadTitle"></span>
        <span class="drop-hint" data-i18n="uploadHint"></span>
        <span class="btn btn-hl drop-btn" aria-hidden="true" data-i18n="chooseFile"></span>
      </label>
      <p class="limits" id="limits" data-i18n="limits"></p>

      <h2 class="samples-title" data-i18n="sampleTitle"></h2>
      <div class="samples">
        <button type="button" class="sample-btn" data-sample="pptc153" lang="en"><b>PPTC 153</b><span data-i18n="sampleEn"></span></button>
        <button type="button" class="sample-btn" data-sample="pptc154" lang="fr"><b>PPTC 154</b><span data-i18n="sampleFr"></span></button>
      </div>
      <p class="supported" data-i18n="supported"></p>

      <div class="footnotes" role="note">
        <p><strong data-i18n="privacy"></strong></p>
        <p data-i18n="aiDisclosure"></p>
        <p data-i18n="notOfficialLong"></p>
      </div>
    </div>
  </div>

  <section class="index-sec" aria-labelledby="svc-title">
    <div>
      <h2 id="svc-title" data-i18n="serviceTitle"></h2>
      <p class="sub" data-i18n="serviceSub"></p>
      <form class="svc-form" id="svc-form" role="search">
        <label for="svc-in" data-i18n="search"></label>
        <div class="svc-row">
          <input class="field-in" id="svc-in" type="search" autocomplete="off" data-i18n-ph="servicePh">
          <button type="submit" class="btn" data-i18n="go"></button>
        </div>
      </form>
    </div>
    <ul class="index" id="svc-list"></ul>
  </section>
</main>

<!-- ================= WORKSPACE ================= -->
<main class="ws" id="main-ws" data-view-panel="workspace">
  <h1 class="sr" id="ws-h1"></h1>
  <div class="margin">
    <nav class="docs" id="docs" data-region data-i18n-aria="docsNav"></nav>
    <button type="button" class="btn btn-quiet fields-btn" id="fields-btn" aria-expanded="false" aria-controls="toc">
      <svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path d="M7 5h10M7 10h10M7 15h10M3 5h.1M3 10h.1M3 15h.1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span data-i18n="fieldsBtn"></span>
    </button>
    <nav class="toc" id="toc" aria-labelledby="toc-title">
      <div class="toc-head">
        <h2 id="toc-title" data-i18n="fieldsTitle"></h2>
        <p class="toc-count" id="toc-count"></p>
        <button type="button" class="icon-btn toc-close" id="toc-close" data-i18n-aria="close">
          <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div id="toc-list" data-region></div>
    </nav>
  </div>

  <div class="desk" id="desk">
    <div class="sheet-col">
      <div class="ws-sheet" id="ws-sheet" data-region></div>
      <nav class="pages" id="pages" data-region data-i18n-aria="pagesNav"></nav>
    </div>
    <div class="note-col" id="note-col">
      <aside class="note" id="note" data-region aria-labelledby="note-title"></aside>
    </div>
    <svg class="leads" id="ws-lines" aria-hidden="true"></svg>
  </div>
</main>

<section class="ask" id="ask" aria-labelledby="ask-title" data-view-panel="workspace">
  <div class="ask-drawer" id="ask-drawer" hidden>
    <div class="ask-dhead">
      <h2 id="ask-title" data-i18n="chatTitle"></h2>
      <button type="button" class="icon-btn" id="ask-close" data-i18n-aria="close">
        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 8l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="ask-log" id="ask-log" role="log" aria-live="polite" aria-labelledby="ask-title" tabindex="0"></div>
    <div class="ask-sugg" id="ask-sugg"></div>
    <div class="ctx" id="ctx" hidden></div>
    <form class="ask-form" id="ask-form">
      <label for="ask-input" class="sr" data-i18n="chatTitle"></label>
      <input class="field-in" id="ask-input" type="text" autocomplete="off" data-i18n-ph="chatPh">
      <button type="submit" class="btn btn-hl" id="ask-send" data-i18n="send"></button>
    </form>
    <div class="ask-fine">
      <p data-i18n="privacy"></p>
      <p data-i18n="aiDisclosure"></p>
    </div>
  </div>
  <div class="ask-bar">
    <button type="button" class="btn btn-hl ask-open" id="ask-open" aria-expanded="false" aria-controls="ask-drawer">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 4h14v9H9l-4 3v-3H3z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
      <span data-i18n="ask"></span>
      <svg class="chev" width="16" height="16" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 12l5-5 5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button type="button" class="ask-prompt" id="ask-prompt"><span data-i18n="chatPh"></span></button>
    <div class="ctx ctx-bar" id="ctx-bar" hidden></div>
  </div>
</section>

<script src="shared/data.js"></script>
<script src="shared/proto.js"></script>
<script>
(function () {
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const D = FH.data;
  const esc = FH.esc;
  const t = FH.t;
  const mqMobile = window.matchMedia("(max-width: 860px)");
  const isMobile = () => mqMobile.matches;
  const view = () => document.body.dataset.view;

  /* Design-local copy, still routed through FH.t so EN/FR switches it. */
  Object.assign(D.i18n.en, {
    fieldsBtn: "Fields",
    close: "Close",
    ask: "Ask",
    chooseFile: "Choose a file",
    noMatch: "No matching service yet. Try a simpler word, such as passport, job or pension.",
    sampleCaption: "A study copy of page 1 of the passport form, with notes in the margin. Selecting a field in Form Helper writes its note for you.",
    showNote: "Show note",
    hideNote: "Hide note",
    you: "You",
    pagesNav: "Pages of this form",
    docsNav: "Your documents",
    goToPage: "Go to page {n}",
  });
  Object.assign(D.i18n.fr, {
    fieldsBtn: "Champs",
    close: "Fermer",
    ask: "Demander",
    chooseFile: "Choisir un fichier",
    noMatch: "Aucun service correspondant pour l'instant. Essayez un mot plus simple, comme passeport, emploi ou pension.",
    sampleCaption: "Une copie d'étude de la page 1 du formulaire de passeport, annotée dans la marge. Quand vous sélectionnez un champ, Aide-formulaires écrit la note pour vous.",
    showNote: "Voir la note",
    hideNote: "Masquer la note",
    you: "Vous",
    pagesNav: "Pages de ce formulaire",
    docsNav: "Vos documents",
    goToPage: "Aller à la page {n}",
  });

  const ICON = {
    clip: '<svg class="clip-icon" viewBox="0 0 14 32" aria-hidden="true"><path d="M5 22V7a3 3 0 0 1 6 0v17a5 5 0 0 1-10 0V9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
    check: '<svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    checkLg: '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8.5l3.2 3L13 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    info: '<svg width="16" height="16" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="8" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 9v5M10 6.2v.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
    pen: '<svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 17l1-4 9.5-9.5a2.1 2.1 0 0 1 3 3L7 16zM12 5l3 3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>',
    chat: '<svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 4h14v9H9l-4 3v-3H3z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>',
    left: '<svg width="16" height="16" viewBox="0 0 20 20" aria-hidden="true"><path d="M16 10H4M9 5l-5 5 5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    right: '<svg width="16" height="16" viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h12M11 5l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    plus: '<svg width="16" height="16" viewBox="0 0 20 20" aria-hidden="true"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  };

  /* ---------------- Focus preservation across re-renders ---------------- */
  let memo = null;
  function capture() {
    if (memo) return;
    const a = document.activeElement;
    if (!a || a === document.body) return;
    const region = a.closest("[data-region]");
    if (!region || !region.id) return;
    const k = a.closest("[data-key]");
    const fld = a.closest("[data-field]");
    const sel = k ? `[data-key="${k.dataset.key}"]` : fld ? `[data-field="${fld.dataset.field}"]` : null;
    if (sel) memo = { region: region.id, sel };
  }
  function restore() {
    const m = memo;
    memo = null;
    if (!m) return;
    const a = document.activeElement;
    if (a && a !== document.body && document.contains(a)) return;
    const r = document.getElementById(m.region);
    if (!r) return;
    let el = r.querySelector(m.sel);
    if (el && !el.matches("button, input, a, [tabindex]")) el = el.querySelector("button, input, a");
    if (el && !el.disabled) el.focus({ preventScroll: true });
    else if (m.region === "note") { const h = $("#note-title"); if (h) h.focus({ preventScroll: true }); }
  }

  /* ---------------- Leader lines ---------------- */
  function leader(x1, y1, x2, y2) {
    const mx = x1 + (x2 - x1) * 0.55;
    const f = (n) => n.toFixed(1);
    const d = `M${f(x1)} ${f(y1)} C${f(mx)} ${f(y1)} ${f(mx)} ${f(y2)} ${f(x2)} ${f(y2)}`;
    return `<path class="lead-halo" d="${d}"/><path class="lead" d="${d}"/><circle class="lead-start" cx="${f(x1)}" cy="${f(y1)}" r="4.5"/><circle class="lead-end" cx="${f(x2)}" cy="${f(y2)}" r="3"/>`;
  }

  let raf = 0;
  let pendingScroll = false;
  function schedule() { cancelAnimationFrame(raf); raf = requestAnimationFrame(layoutAll); }
  function layoutAll() { layoutWs(); layoutLanding(); }

  /* ---------------- Landing ---------------- */
  const SAMPLE = [
    { id: "surname", body: (f) => `<p>${esc(f.enter)}</p>` },
    { id: "dob", body: (f) => `<p>${esc(f.enter)}</p><p class="snote-ex"><span class="snote-k">${esc(t("example"))}</span><b>${esc(f.example)}</b></p>` },
    { id: "travel", body: (f) => `<p><span class="snote-k">${esc(t("mistakes"))}</span>${esc(f.mistakes[0])}</p>` },
  ];

  function renderLanding() {
    const s = FH.state;
    const saved = { page: s.page, docId: s.docId, selectedId: s.selectedId, visited: s.visited };
    s.page = 1;
    s.docId = FH.lang === "fr" ? "pptc154" : "pptc153";
    s.selectedId = "dob";
    s.visited = new Set(["surname", "dob", "travel"]);
    try { FH.renderSheet($("#sample-sheet"), { compact: true }); }
    finally { Object.assign(s, saved); }

    $("#sample-notes").innerHTML = SAMPLE.map(({ id, body }) => {
      const f = FH.field(id);
      return `<li class="snote" data-for="${id}"><p class="snote-title"><span class="hl">${esc(f.label)}</span></p>${body(f)}${FH.sourceList(f.sources.slice(0, 1))}</li>`;
    }).join("");
    renderServices();
    schedule();
  }

  function layoutLanding() {
    if (view() !== "landing") return;
    const svg = $("#sample-lines"), wrap = $("#sample-desk"), list = $("#sample-notes");
    const notes = $$(".snote", list);
    if (isMobile()) {
      svg.innerHTML = "";
      list.style.height = "";
      notes.forEach((n) => { n.style.top = ""; });
      return;
    }
    const lr = list.getBoundingClientRect();
    let floor = 0;
    notes.forEach((n) => {
      const fEl = $(`#sample-sheet [data-field="${n.dataset.for}"]`);
      const title = $(".snote-title", n);
      if (!fEl || !title) return;
      const fr = fEl.getBoundingClientRect();
      const fy = fr.top + fr.height / 2 - lr.top;
      const top = Math.max(floor, fy - (title.offsetTop + title.offsetHeight / 2));
      n.style.top = `${top}px`;
      floor = top + n.offsetHeight + 28;
    });
    list.style.height = `${floor}px`;
    const wr = wrap.getBoundingClientRect();
    svg.innerHTML = notes.map((n) => {
      const fEl = $(`#sample-sheet [data-field="${n.dataset.for}"]`);
      const title = $(".snote-title", n);
      if (!fEl || !title) return "";
      const fr = fEl.getBoundingClientRect();
      const tr = title.getBoundingClientRect();
      return leader(fr.right - wr.left, fr.top + fr.height / 2 - wr.top, tr.left - wr.left - 10, tr.top + tr.height / 2 - wr.top);
    }).join("");
  }

  const norm = (s) => String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  function renderServices() {
    const q = norm($("#svc-in").value.trim());
    const toks = q.split(/[^a-z0-9]+/).filter((w) => w.length >= 3);
    const rows = D.services.map((s) => {
      const r = D.resources[s.id];
      const hay = norm([s.en, s.fr, s.dept, r.en, r.fr].join(" "));
      return { s, score: toks.length ? toks.filter((w) => hay.includes(w)).length : 1 };
    }).filter((x) => x.score > 0).sort((a, b) => b.score - a.score);
    $("#svc-list").innerHTML = rows.length
      ? rows.map(({ s }) => {
          const r = FH.resource(s.id);
          return `<li><a href="${esc(r.url)}" target="_blank" rel="noopener"><span class="ix-title">${esc(s[FH.lang])}</span><span class="ix-leader" aria-hidden="true"></span><span class="ix-dept">${esc(s.dept)}</span></a>${r.note ? `<small class="ix-note">${esc(r.note)}</small>` : ""}</li>`;
        }).join("")
      : `<li class="ix-empty">${esc(t("noMatch"))}</li>`;
  }
  /* ---------------- Workspace: margin ---------------- */
  function renderDocs() {
    const cur = FH.doc();
    $("#ws-h1").textContent = `${cur.number} · ${cur.title[FH.lang]}`;
    $("#docs").innerHTML = `
      <ul class="clips">${D.docs.map((d) => {
        const on = d.id === FH.state.docId;
        return `<li><button type="button" class="clip" data-key="doc-${d.id}" data-doc="${d.id}" aria-pressed="${on}">${ICON.clip}<span class="clip-num">${esc(d.number)}</span><span class="clip-name">${esc(d.short[FH.lang])}</span></button></li>`;
      }).join("")}</ul>
      <div class="docs-meta">
        <p class="count">${esc(t("docsCount", { n: D.docs.length }))}</p>
        <label class="add-pdf" data-key="add-pdf">${ICON.plus}<span>${esc(t("addPdf"))}</span><input type="file" class="sr" accept="application/pdf,.pdf"></label>
      </div>`;
  }

  function renderToc() {
    const st = FH.state;
    $("#toc-count").textContent = `${st.visited.size}/${D.fields.length} ${t("viewed")}`;
    $("#toc-list").innerHTML = FH.sectionsInOrder().map((s) => `
      <section class="toc-sec" aria-labelledby="toc-s-${s.id}">
        <h3 id="toc-s-${s.id}">${esc(s.label)}</h3>
        <ol>${s.fields.map((f) => {
          const vis = st.visited.has(f.id);
          const sel = st.selectedId === f.id;
          return `<li><button type="button" class="toc-item" data-key="toc-${f.id}" data-id="${f.id}"${sel ? ' aria-current="true"' : ""}><span class="tick${vis ? " on" : ""}" aria-hidden="true">${vis ? ICON.check : ""}</span><span class="toc-label">${esc(f.label)}${vis ? `<span class="sr"> (${esc(t("viewed"))})</span>` : ""}</span><span class="toc-pg">${esc(t("page"))} ${f.page}</span></button></li>`;
        }).join("")}</ol>
      </section>`).join("");
  }

  function renderPages() {
    const doc = FH.doc();
    const p = FH.state.page;
    const has = new Set(D.fields.map((f) => f.page));
    const nums = Array.from({ length: doc.pages }, (_, i) => i + 1);
    $("#pages").innerHTML = `
      <p class="pages-label" aria-hidden="true">${esc(t("page"))} ${p} ${esc(t("of"))} ${doc.pages}</p>
      <ol>${nums.map((n) => {
        const seen = D.fields.some((f) => f.page === n && FH.state.visited.has(f.id));
        const lines = has.has(n) ? "<i></i><i></i><i></i><i></i><i></i>" : "<i></i><i></i>";
        return `<li><button type="button" class="pg" data-key="pg-${n}" data-page="${n}" aria-label="${esc(t("page"))} ${n} ${esc(t("of"))} ${doc.pages}"${n === p ? ' aria-current="page"' : ""}><span class="pg-thumb${has.has(n) ? " has" : ""}${seen ? " seen" : ""}" aria-hidden="true">${lines}</span><span class="pg-n" aria-hidden="true">${n}</span></button></li>`;
      }).join("")}</ol>`;
  }

  /* ---------------- Workspace: the margin note ---------------- */
  function renderNote() {
    const id = FH.state.selectedId;
    const f = id ? FH.field(id) : null;
    const note = $("#note");
    if (!f) {
      note.innerHTML = `<div class="note-head"><p class="note-empty note-anchor" id="note-title" tabindex="-1">${ICON.pen}<span>${esc(t("selectPrompt"))}</span></p></div>`;
      return;
    }
    const open = document.body.classList.contains("note-open");
    const i = D.fields.findIndex((x) => x.id === id);
    const sec = (key, html) => `<section class="note-sec"><h3>${esc(t(key))}</h3>${html}</section>`;
    const ul = (arr, cls = "") => `<ul class="${cls}">${arr.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>`;
    const onPage = f.page === FH.state.page;
    note.innerHTML = `
      <div class="note-head">
        <h2 id="note-title" class="note-anchor" tabindex="-1"><span class="hl">${esc(f.label)}</span></h2>
        <p class="note-meta">${esc(f.sectionLabel)} · ${onPage
          ? `${esc(t("page"))} ${f.page}`
          : `<button type="button" class="linkish" data-key="note-goto" data-goto="${f.page}">${esc(t("goToPage", { n: f.page }))}</button>`}</p>
        <button type="button" class="btn btn-quiet btn-sm note-toggle" data-key="note-toggle" data-act="toggle" aria-expanded="${open}" aria-controls="note-body">${esc(t(open ? "hideNote" : "showNote"))}</button>
      </div>
      <div class="note-body" id="note-body">
        <div class="note-flags">
          ${f.bold ? `<p class="flag-req">${ICON.pen}<span>${esc(t("required"))}</span></p>` : ""}
          <p class="flag-src${f.grounded ? "" : " is-general"}">${f.grounded ? ICON.checkLg : ICON.info}<span>${esc(t(f.grounded ? "grounded" : "general"))}</span></p>
        </div>
        <div class="note-actions">
          <button type="button" class="btn btn-hl" data-key="note-ask" data-act="ask">${ICON.chat}<span>${esc(t("askField"))}</span></button>
          <div class="note-step">
            <button type="button" class="btn btn-quiet btn-sm" data-key="note-prev" data-act="prev"${i <= 0 ? " disabled" : ""}>${ICON.left}<span>${esc(t("prev"))}</span></button>
            <button type="button" class="btn btn-quiet btn-sm" data-key="note-next" data-act="next"${i >= D.fields.length - 1 ? " disabled" : ""}><span>${esc(t("next"))}</span>${ICON.right}</button>
          </div>
        </div>
        ${f.meaning ? sec("meaning", `<p>${esc(f.meaning)}</p>`) : ""}
        ${f.enter ? sec("enter", `<p>${esc(f.enter)}</p>`) : ""}
        ${f.options ? sec("options", ul(f.options)) : ""}
        ${f.example ? sec("example", `<p><span class="ex">${esc(f.example)}</span></p>`) : ""}
        ${f.find ? sec("find", `<p>${esc(f.find)}</p>`) : ""}
        ${f.points ? `<section class="note-sec"><h3>${esc(f.points.title)}</h3>${ul(f.points.items, "pts")}</section>` : ""}
        ${f.mistakes.length ? sec("mistakes", ul(f.mistakes, "mst")) : ""}
        ${f.sources.length ? sec("sources", FH.sourceList(f.sources)) : ""}
      </div>`;
  }

  function setNoteOpen(open) {
    document.body.classList.toggle("note-open", open);
    const b = $("#note .note-toggle");
    if (b) { b.setAttribute("aria-expanded", open); b.textContent = t(open ? "hideNote" : "showNote"); }
    schedule();
  }

  function layoutWs() {
    if (view() !== "workspace") return;
    const desk = $("#desk"), note = $("#note"), col = $("#note-col"), svg = $("#ws-lines");
    const id = FH.state.selectedId;
    const fieldEl = id ? $(`#ws-sheet [data-field="${id}"]`) : null;
    if (pendingScroll && fieldEl) {
      const fr = fieldEl.getBoundingClientRect();
      const topLimit = $(".strip").offsetHeight + 12;
      const bottomLimit = window.innerHeight - (isMobile() ? window.innerHeight * 0.45 : 0) - $(".ask-bar").offsetHeight - 12;
      if (fr.top < topLimit || fr.bottom > bottomLimit) window.scrollBy(0, fr.top - topLimit - (isMobile() ? 12 : window.innerHeight * 0.18));
    }
    pendingScroll = false;
    if (isMobile()) {
      note.style.top = "";
      col.style.minHeight = "";
      svg.innerHTML = "";
      return;
    }
    const anchor = $(".note-anchor", note);
    const dr = desk.getBoundingClientRect();
    let top = 0;
    if (fieldEl && anchor) {
      const fr = fieldEl.getBoundingClientRect();
      top = Math.max(0, fr.top + fr.height / 2 - dr.top - (anchor.offsetTop + anchor.offsetHeight / 2));
    }
    note.style.top = `${top}px`;
    col.style.minHeight = `${top + note.offsetHeight + 24}px`;
    if (!fieldEl || !anchor) { svg.innerHTML = ""; return; }
    const d2 = desk.getBoundingClientRect();
    const fr = fieldEl.getBoundingClientRect();
    const ar = anchor.getBoundingClientRect();
    svg.innerHTML = leader(fr.right - d2.left, fr.top + fr.height / 2 - d2.top, ar.left - d2.left - 12, ar.top + ar.height / 2 - d2.top);
  }

  /* ---------------- Fields list overlay (mobile) ---------------- */
  function openToc() {
    document.body.classList.add("toc-open");
    $("#fields-btn").setAttribute("aria-expanded", "true");
    $("#toc-close").focus();
  }
  function closeToc(returnFocus = true) {
    document.body.classList.remove("toc-open");
    $("#fields-btn").setAttribute("aria-expanded", "false");
    if (returnFocus) $("#fields-btn").focus();
  }
  /* ---------------- Chat drawer ---------------- */
  const chat = { extra: [], ctx: null, thinking: false, open: false, opened: false };
  const log = $("#ask-log");
  const genericReply = FH.reply("\u0000").text;

  function materialize(m) {
    if (m.role === "user") return { role: "user", text: m.key ? t(m.key) : m.text, ctx: m.ctx };
    return { role: "assistant", ...FH.reply(m.q) };
  }
  function msgHTML(m) {
    if (m.kind === "overview") {
      const o = m.overview;
      return `<article class="msg msg-ov">
        <h3>${esc(t("overviewTitle"))}</h3>
        <p class="ov-title"><strong>${esc(o.title)}</strong> · ${esc(o.department)}</p>
        <p>${esc(o.summary)}</p>
        <h4>${esc(t("who"))}</h4><p>${esc(o.who)}</p>
        <h4>${esc(t("need"))}</h4><ul>${o.need.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>
        <h4>${esc(t("submit"))}</h4><p>${esc(o.submit)}</p>
        <h4>${esc(t("sources"))}</h4>${FH.sourceList(o.sources)}
      </article>`;
    }
    if (m.role === "user") {
      const cf = m.ctx ? FH.field(m.ctx) : null;
      return `<div class="msg msg-user"><p class="msg-who">${esc(t("you"))}</p>${cf ? `<p class="msg-ctx">${esc(t("askingAbout"))}: ${esc(cf.label)}</p>` : ""}<p>${esc(m.text)}</p></div>`;
    }
    const refs = (m.refs || []).map((id) => FH.field(id)).filter(Boolean);
    return `<div class="msg msg-ai">
      <p class="msg-who">${esc(t("brand"))}</p>
      <p>${esc(m.text)}</p>
      ${m.list ? `<ul>${m.list.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
      ${refs.length ? `<div class="refs">${refs.map((f) => `<button type="button" class="ref" data-ref="${f.id}">${ICON.right}<span>${esc(f.label)}</span></button>`).join("")}</div>` : ""}
      ${m.sources && m.sources.length ? FH.sourceList(m.sources) : ""}
      <p class="msg-proto">${esc(t("protoReply"))}</p>
    </div>`;
  }
  const thinkingHTML = () => `<div class="msg msg-ai is-thinking" id="thinking" role="status"><p class="msg-who">${esc(t("brand"))}</p><p>${esc(t("thinking"))}</p></div>`;

  function renderChat() {
    const all = [...FH.seedChat(), ...chat.extra.map(materialize)];
    log.innerHTML = all.map(msgHTML).join("") + (chat.thinking ? thinkingHTML() : "");
    $("#ask-sugg").innerHTML = ["suggestion1", "suggestion2", "suggestion3"]
      .map((k) => `<button type="button" class="sugg" data-sugg="${k}">${esc(t(k))}</button>`).join("");
    renderCtx();
  }
  function renderCtx() {
    const f = chat.ctx ? FH.field(chat.ctx) : null;
    const html = f ? `<span class="ctx-chip"><span>${esc(t("askingAbout"))}: <strong>${esc(f.label)}</strong></span><button type="button" class="ctx-clear" data-act="clear-ctx">${esc(t("clear"))}</button></span>` : "";
    ["#ctx", "#ctx-bar"].forEach((s) => { $(s).innerHTML = html; $(s).hidden = !f; });
  }
  const scrollEnd = () => { log.scrollTop = log.scrollHeight; };

  function setDrawer(open, focusInput) {
    chat.open = open;
    $("#ask-drawer").hidden = !open;
    $("#ask-open").setAttribute("aria-expanded", String(open));
    if (open) {
      if (!chat.opened) { chat.opened = true; log.scrollTop = 0; }
      if (focusInput) $("#ask-input").focus();
    }
  }

  function send(text, key) {
    if (chat.thinking) return;
    const val = (key ? t(key) : text || "").trim();
    if (!val) return;
    const u = { role: "user", text: key ? null : val, key, ctx: chat.ctx };
    chat.extra.push(u);
    log.insertAdjacentHTML("beforeend", msgHTML(materialize(u)));
    let q = val;
    if (chat.ctx && FH.reply(val).text === genericReply) q = `${val} ${D.fields.find((x) => x.id === chat.ctx).en.label}`;
    chat.thinking = true;
    $("#ask-send").disabled = true;
    log.insertAdjacentHTML("beforeend", thinkingHTML());
    scrollEnd();
    setTimeout(() => {
      const th = $("#thinking");
      if (th) th.remove();
      const r = { role: "assistant", q };
      chat.extra.push(r);
      chat.thinking = false;
      $("#ask-send").disabled = false;
      log.insertAdjacentHTML("beforeend", msgHTML(materialize(r)));
      scrollEnd();
    }, 600);
  }

  function askAbout(id) {
    chat.ctx = id;
    renderCtx();
    setDrawer(true, true);
  }

  /* ---------------- Events ---------------- */
  $("#lang-btn").addEventListener("click", () => FH.toggleLang());
  $("#new-session").addEventListener("click", () => {
    FH.state.visited.clear();
    chat.extra = [];
    chat.ctx = null;
    chat.thinking = false;
    $("#ask-send").disabled = false;
    renderChat();
    FH.select(null);
  });

  // Landing
  $$("[data-sample]").forEach((b) => b.addEventListener("click", () => {
    FH.setDoc(b.dataset.sample);
    if (!FH.state.selectedId) FH.select("g-number");
    FH.showView("workspace");
  }));
  const drop = $("#drop");
  const openUpload = () => {
    FH.setDoc(FH.lang === "fr" ? "pptc154" : "pptc153");
    FH.showView("workspace");
  };
  ["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("is-over"); }));
  ["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove("is-over"); }));
  drop.addEventListener("drop", openUpload);
  $("#file-in").addEventListener("change", (e) => { if (e.target.files.length) { e.target.value = ""; openUpload(); } });
  $("#svc-in").addEventListener("input", renderServices);
  $("#svc-form").addEventListener("submit", (e) => { e.preventDefault(); renderServices(); const a = $("#svc-list a"); if (a) a.focus(); });

  // Workspace margin
  $("#docs").addEventListener("click", (e) => {
    const b = e.target.closest("[data-doc]");
    if (b) FH.setDoc(b.dataset.doc);
  });
  $("#docs").addEventListener("change", (e) => { if (e.target.type === "file") e.target.value = ""; });
  $("#fields-btn").addEventListener("click", openToc);
  $("#toc-close").addEventListener("click", () => closeToc());
  $("#toc-list").addEventListener("click", (e) => {
    const b = e.target.closest("[data-id]");
    if (!b) return;
    pendingScroll = true;
    FH.select(b.dataset.id);
    if (isMobile()) {
      closeToc(false);
      const h = $("#note-title");
      if (h) h.focus({ preventScroll: true });
    }
  });
  $("#pages").addEventListener("click", (e) => {
    const b = e.target.closest("[data-page]");
    if (b) FH.setPage(Number(b.dataset.page));
  });

  // Note
  $("#note").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.dataset.goto) { FH.setPage(Number(b.dataset.goto)); return; }
    const act = b.dataset.act;
    if (act === "toggle") setNoteOpen(!document.body.classList.contains("note-open"));
    else if (act === "ask") askAbout(FH.state.selectedId);
    else if (act === "prev" || act === "next") { pendingScroll = true; FH.step(act === "prev" ? -1 : 1); }
  });

  // Chat
  $("#ask-open").addEventListener("click", () => setDrawer(!chat.open, false));
  $("#ask-prompt").addEventListener("click", () => setDrawer(true, true));
  $("#ask-close").addEventListener("click", () => { setDrawer(false); $("#ask-open").focus(); });
  $("#ask-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const inp = $("#ask-input");
    if (chat.thinking || !inp.value.trim()) return;
    send(inp.value);
    inp.value = "";
  });
  $("#ask-sugg").addEventListener("click", (e) => {
    const b = e.target.closest("[data-sugg]");
    if (b) send(null, b.dataset.sugg);
  });
  log.addEventListener("click", (e) => {
    const b = e.target.closest("[data-ref]");
    if (!b) return;
    pendingScroll = true;
    FH.select(b.dataset.ref);
    if (isMobile()) {
      setDrawer(false);
      const h = $("#note-title");
      if (h) h.focus({ preventScroll: true });
    }
  });
  $("#ask").addEventListener("click", (e) => {
    if (!e.target.closest('[data-act="clear-ctx"]')) return;
    const inDrawer = !!e.target.closest("#ask-drawer");
    chat.ctx = null;
    renderCtx();
    (inDrawer ? $("#ask-input") : $("#ask-prompt")).focus();
  });

  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if (chat.open) { setDrawer(false); $("#ask-open").focus(); }
    else if (document.body.classList.contains("toc-open")) closeToc();
    else if (isMobile() && document.body.classList.contains("note-open")) {
      setNoteOpen(false);
      const b = $("#note .note-toggle");
      if (b) b.focus();
    }
  });

  window.addEventListener("resize", schedule);
  mqMobile.addEventListener("change", () => { if (!isMobile()) closeToc(false); schedule(); });
  if ("ResizeObserver" in window) {
    const ro = new ResizeObserver(schedule);
    [$("#note"), $("#ws-sheet"), $("#sample-sheet"), $("#sample-notes")].forEach((el) => ro.observe(el));
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(schedule);

  /* ---------------- Boot ---------------- */
  let booted = false;
  FH.applyI18n(document);
  const EVTS = ["select", "page", "doc", "lang"];
  EVTS.forEach((e) => FH.on(e, capture));
  FH.mountSheet($("#ws-sheet"));

  FH.on("select", (f) => {
    renderToc();
    renderPages();
    renderNote();
    if (booted && isMobile()) setNoteOpen(!!f);
    schedule();
  });
  FH.on("page", () => { renderPages(); renderNote(); schedule(); });
  FH.on("doc", () => { renderDocs(); renderPages(); schedule(); });
  FH.on("lang", (lang) => {
    $("#lang-btn").setAttribute("lang", lang === "en" ? "fr" : "en");
    renderDocs();
    renderToc();
    renderPages();
    renderNote();
    renderChat();
    renderLanding();
    schedule();
  });
  EVTS.forEach((e) => FH.on(e, restore));

  $("#lang-btn").setAttribute("lang", "fr");
  renderDocs();
  renderToc();
  renderPages();
  renderNote();
  renderChat();
  renderLanding();
  FH.select("g-number");
  booted = true;

  FH.mountSwitcher(() => {
    if (view() === "landing") setDrawer(false);
    schedule();
  });
})();
</script>
</body>
</html>
