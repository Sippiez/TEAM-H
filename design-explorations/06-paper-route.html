<!doctype html><html lang="en"><head><meta charset="utf-8">
<!--
DIRECTION CONTRACT · 06 Paper Route (Transit layout + Marginalia simplicity)
THESIS: A form is a route of fields. Keep the wayfinding layout of Transit (route line, You are here, page stops, field sign, service map, sample board) but draw it in pencil on paper, the way Marginalia would.
OWN-WORLD: Cool white desk, white paper with offset shadow, graphite ink, one highlighter yellow for "you are here" and the selected field, pencil blue for links only. No dark sign panels and no line colours: map lines differ by dash pattern. Atkinson Hyperlegible Next.
STORY: Landing: plain headline, a paper drop card, a sample-forms sheet and a pencil-drawn service map. Workspace: route of fields on the left with a highlighter marker, the form on a paper strip of document tabs and page stops in the centre, the field note and questions on the right.
FORM: The facsimile stays a plain document; selection is a highlighter swipe with a route dot on its corner.
-->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Form Helper · Paper Route</title>
<link rel="stylesheet" href="shared/form-sheet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --desk: #f3f5f7;
    --paper: #ffffff;
    --ink: #22262b;
    --ink-2: #4a525c;
    --rule: #cdd3da;
    --rule-2: #e3e7ec;
    --hl: #ffe94d;
    --hl-2: #ffdf1a;
    --hl-ink: #8a6e00;
    --pencil: #2556a6;
    --font: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, sans-serif;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --paper-shadow: 0 1px 2px rgb(34 38 43 / 0.10), 8px 14px 28px -10px rgb(34 38 43 / 0.30);
    --paper-shadow-sm: 0 1px 1px rgb(34 38 43 / 0.08), 3px 5px 12px -6px rgb(34 38 43 / 0.30);
  }
  *, *::before, *::after { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; font: 17px/1.55 var(--font); color: var(--ink); background: var(--desk); }
  h1, h2, h3 { margin: 0; font-weight: 800; line-height: 1.2; text-wrap: balance; }
  p { margin: 0; }
  a { color: var(--pencil); text-decoration-thickness: 1px; text-underline-offset: 0.18em; }
  a:hover { text-decoration-thickness: 2px; }
  button { font: inherit; color: inherit; }
  .tnum { font-variant-numeric: tabular-nums; }
  .sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  :focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; border-radius: 3px; }
  .hl { background: linear-gradient(transparent 56%, var(--hl) 56%, var(--hl) 94%, transparent 94%); -webkit-box-decoration-break: clone; box-decoration-break: clone; padding: 0 3px; margin: 0 -3px; }

  .ico { width: 1.15em; height: 1.15em; flex: none; }
  .ico-slot { display: inline-flex; }
  .pict { display: inline-grid; place-items: center; flex: none; width: 24px; height: 24px; color: var(--ink); }
  .pict .ico { width: 100%; height: 100%; }
  .pict.sm { width: 20px; height: 20px; }

  /* Tags (formerly coloured line badges) */
  .lb { display: inline-flex; align-items: center; padding: 1px 8px; border: 1.5px solid var(--ink); border-radius: 4px; background: var(--paper); color: var(--ink); font-weight: 700; font-size: 0.8125rem; line-height: 1.45; white-space: nowrap; }
  .lb.outline { border-style: dashed; }
  .lb-stack { display: flex; flex-wrap: wrap; gap: 4px; }

  /* Header */
  .hdr { display: flex; align-items: center; gap: 10px 24px; flex-wrap: wrap; min-height: 60px; padding: 8px 28px; border-bottom: 1px solid var(--rule); background: var(--desk); }
  .brand { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; color: var(--ink); text-decoration: none; font-weight: 800; font-size: 19px; letter-spacing: -0.01em; white-space: nowrap; }
  .brand:hover span { text-decoration: underline; text-underline-offset: 0.2em; }
  .hdr-notice { display: flex; align-items: center; gap: 8px; margin-right: auto; font-size: 15px; color: var(--ink-2); }
  .lang-btn { min-height: 44px; padding: 0 16px; border-radius: 6px; border: 1.5px solid var(--ink); background: var(--paper); font-weight: 700; cursor: pointer; }
  .lang-btn:hover { background: var(--hl); }

  /* ---------------- Landing ---------------- */
  .landing { max-width: 1360px; margin: 0 auto; padding: 40px 28px 120px; }
  .l-grid { display: grid; grid-template-columns: 5fr 7fr; gap: 40px; align-items: start; }
  .l-col { display: flex; flex-direction: column; gap: 32px; min-width: 0; }
  .l-col.right { flex-direction: column-reverse; justify-content: flex-end; }

  .hero-sign { display: flex; flex-direction: column; gap: 16px; padding-top: 4px; }
  .hero-sign > .pict { display: none; }
  .hero-sign h1 { font-size: clamp(2.15rem, 3vw, 2.9rem); letter-spacing: -0.02em; line-height: 1.08; }
  .hero-sign p { margin-top: 16px; color: var(--ink-2); font-size: 19px; max-width: 42ch; }

  .ticket { display: flex; flex-direction: column; background: var(--paper); box-shadow: var(--paper-shadow); }
  .ticket-head { display: flex; align-items: center; gap: 10px; padding: 18px 24px 0; }
  .ticket-head .pict { display: none; }
  .ticket-head h2 { font-size: 22px; }
  .ticket-body { padding: 14px 24px 24px; display: flex; flex-direction: column; gap: 14px; }
  .drop { position: relative; display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 2px 16px; padding: 22px 22px; background: var(--paper); cursor: pointer; }
  .drop::before { content: ""; position: absolute; inset: 0; border: 1.5px dashed #8a939d; border-radius: 4px; pointer-events: none; }
  .drop:hover::before, .drop.is-over::before { border-color: var(--ink); }
  .drop.is-over { background: #fffbe0; }
  .drop:focus-within { outline: 3px solid var(--ink); outline-offset: 3px; }
  .drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .drop .pict { width: 32px; height: 32px; grid-row: span 2; }
  .drop strong { font-size: 19px; font-weight: 800; line-height: 1.25; }
  .drop .hint { color: var(--ink-2); }
  .limits { display: flex; flex-wrap: wrap; gap: 2px 18px; list-style: none; margin: 0; padding: 0; font-size: 15.5px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .status:empty { display: none; }
  .status { font-weight: 700; padding: 10px 12px; border-radius: 4px; background: #fffbe0; }
  .supported { display: flex; gap: 8px; align-items: flex-start; font-weight: 700; font-size: 15.5px; }
  .supported .pict { margin-top: 2px; }
  .notice { display: flex; gap: 10px; align-items: flex-start; font-size: 15.5px; line-height: 1.5; color: var(--ink-2); }
  .notice .pict { width: 20px; height: 20px; margin-top: 2px; color: var(--ink); }
  .ticket .notice:first-of-type { position: relative; padding-top: 16px; margin-top: 2px; }
  .ticket .notice:first-of-type::before { content: ""; position: absolute; top: 0; left: 0; width: 72px; border-top: 1.5px solid var(--ink); }

  .map { padding: 22px 24px 18px; background: var(--paper); box-shadow: var(--paper-shadow-sm); display: flex; flex-direction: column; gap: 10px; }
  .map-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 16px; }
  .map-head h2 { font-size: 22px; }
  .map-head p { color: var(--ink-2); font-size: 15.5px; }
  .map-stage { position: relative; width: 100%; margin: 8px 0; }
  .map-stage svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .stn-link { position: absolute; width: 0; height: 0; color: var(--ink); text-decoration: none; }
  .stn-link .dot { position: absolute; left: 0; top: 0; width: 16px; height: 16px; transform: translate(-50%, -50%); border-radius: 50%; background: var(--paper); border: 2.5px solid var(--ink); }
  .stn-link.is-x .dot { width: 22px; height: 22px; border-width: 3px; box-shadow: inset 0 0 0 3px var(--paper), inset 0 0 0 7px var(--ink); }
  .stn-link .lab { position: absolute; width: max-content; max-width: 150px; padding: 2px 6px; border-radius: 3px; background: var(--paper); font-weight: 700; font-size: 15px; line-height: 1.25; color: var(--pencil); text-decoration: underline 1px; text-underline-offset: 0.18em; }
  .at-right .lab { left: 16px; top: 0; transform: translateY(-50%); }
  .at-right-up .lab { left: 18px; bottom: -10px; }
  .at-below .lab { left: 0; top: 16px; transform: translateX(-50%); text-align: center; }
  .at-above .lab { left: 0; bottom: 16px; transform: translateX(-50%); text-align: center; }
  .at-above-end .lab { right: 14px; bottom: 12px; text-align: right; }
  .stn-link:hover .lab { text-decoration-thickness: 2px; }
  .stn-link:focus-visible { outline: none; }
  .stn-link:focus-visible .lab { outline: 3px solid var(--ink); outline-offset: 2px; }
  .stn-link.is-match .lab { background: var(--hl); color: var(--ink); }
  .stn-link.is-match .dot { background: var(--hl); }
  .stn-link.is-dim { opacity: 0.35; }
  .map.is-tall .lab { max-width: 240px; font-size: 16px; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 22px; list-style: none; margin: 0; padding: 10px 0 0; border-top: 1px solid var(--rule-2); font-weight: 600; font-size: 15px; color: var(--ink-2); }
  .legend li { display: flex; align-items: center; gap: 8px; }
  .legend svg { flex: none; }
  .legend .x { width: 16px; height: 16px; border-radius: 50%; border: 2.5px solid var(--ink); background: var(--paper); box-shadow: inset 0 0 0 2px var(--paper), inset 0 0 0 5px var(--ink); }
  .map-note:empty { display: none; }
  .map-note { color: var(--ink-2); font-size: 15px; }

  .board { padding: 22px 24px 8px; background: var(--paper); box-shadow: var(--paper-shadow-sm); }
  .board-head { display: flex; align-items: center; gap: 10px; padding-bottom: 12px; }
  .board-head .pict { display: none; }
  .board-head h2 { font-size: 22px; }
  .board-rows { list-style: none; margin: 0; padding: 0; }
  .board-row { display: grid; grid-template-columns: 6.5rem 1fr auto auto; align-items: center; gap: 8px 16px; padding: 14px 0; border-top: 1px solid var(--rule-2); }
  .board-code { font-weight: 800; font-size: 17px; font-variant-numeric: tabular-nums; }
  .board-title { font-weight: 600; font-size: 18px; line-height: 1.3; }
  .board-lang { border: 1.5px solid var(--ink); border-radius: 4px; padding: 0 7px; font-weight: 700; font-size: 14px; }
  .board-open { min-height: 44px; padding: 0 14px; border: 1.5px solid var(--ink); border-radius: 6px; background: var(--hl); color: var(--ink); font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; }
  .board-open:hover { background: var(--hl-2); }

  .finder { margin-top: 96px; padding-top: 40px; border-top: 1px solid var(--rule); display: grid; grid-template-columns: 5fr 7fr; gap: 40px; align-items: start; }
  .finder-sign { display: flex; flex-direction: column; gap: 10px; }
  .finder-sign h2 { display: flex; align-items: center; gap: 10px; font-size: 28px; letter-spacing: -0.01em; }
  .finder-sign h2 .pict { display: none; }
  .finder-sign > p { color: var(--ink-2); max-width: 46ch; }
  .finder-form { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .finder-form label { width: 100%; font-weight: 700; }
  .finder-form input { flex: 1 1 220px; min-height: 48px; padding: 0 14px; border: 1.5px solid #6b7480; border-radius: 6px; font: inherit; color: var(--ink); background: var(--paper); }
  input::placeholder { color: #4f5863; opacity: 1; }
  .btn-dark { min-height: 48px; padding: 0 16px; border: 1.5px solid var(--ink); border-radius: 6px; background: var(--paper); color: var(--ink); font-weight: 700; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
  .btn-dark:hover { background: var(--hl); }
  .svc-list { list-style: none; margin: 0; padding: 0; }
  .svc-list li { border-bottom: 1px solid var(--rule-2); }
  .svc { display: grid; grid-template-columns: 8.5rem 1fr auto; align-items: center; gap: 6px 16px; min-height: 56px; padding: 12px 0; color: var(--ink); text-decoration: none; }
  .svc:hover .svc-name { text-decoration-thickness: 2px; }
  .svc:focus-visible { outline-offset: 2px; }
  .svc-name { display: block; font-weight: 600; font-size: 19px; line-height: 1.3; color: var(--pencil); text-decoration: underline 1px; text-underline-offset: 0.18em; }
  .svc-src { display: block; color: var(--ink-2); font-size: 15px; }
  .svc-end { display: flex; align-items: center; gap: 10px; color: var(--ink-2); }
  .svc-dept { font-weight: 800; font-size: 16px; color: var(--ink); }
  .no-match { padding: 14px 0; color: var(--ink-2); }

  .l-foot { margin-top: 56px; }
  .l-foot .notice { max-width: 80ch; }

  /* ---------------- Workspace ---------------- */
  .ws { display: grid; grid-template-columns: 300px minmax(0, 1fr) 456px; }
  @media (min-width: 1081px) {
    body[data-view="workspace"] { height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
    body[data-view="workspace"] main { flex: 1; min-height: 0; }
    .ws { height: 100%; grid-template-rows: minmax(0, 1fr); }
    .ws-side { overflow: hidden; }
  }
  .ws-route { overflow: auto; border-right: 1px solid var(--rule); padding: 20px 14px 100px 10px; background: var(--desk); }
  .route-head { padding: 0 6px 12px 14px; display: flex; flex-direction: column; gap: 2px; }
  .route-head h2 { font-size: 17px; }
  .route-count { color: var(--ink-2); font-size: 15px; font-variant-numeric: tabular-nums; }
  .track { position: relative; }
  .sec-head { position: relative; padding: 18px 0 8px 52px; }
  .sec-head .lb { border: 0; padding: 0; background: none; font-size: 15px; font-weight: 700; color: var(--ink-2); white-space: normal; }
  .sec-head::before { content: ""; position: absolute; left: 27px; top: 0; bottom: 0; width: 2px; background: var(--ink); }
  .sec:first-child .sec-head::before { display: none; }
  .sec ol { list-style: none; margin: 0; padding: 0; }
  .stn { position: relative; display: block; width: 100%; min-height: 46px; padding: 10px 12px 10px 52px; border: 0; border-radius: 4px; background: transparent; color: var(--ink); text-align: left; cursor: pointer; }
  .stn::before { content: ""; position: absolute; left: 27px; top: 0; bottom: 0; width: 2px; background: var(--ink); }
  .stn.is-first::before { top: 23px; }
  .stn.is-last::before { bottom: auto; height: 23px; }
  .stn .dot { position: absolute; left: 21px; top: 16px; width: 14px; height: 14px; z-index: 1; border-radius: 50%; background: var(--paper); border: 2px solid var(--ink); }
  .stn.is-visited .dot { background: var(--ink); }
  .stn-yah { display: none; font-weight: 700; font-size: 13px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink); }
  .stn-label { display: block; font-size: 15.5px; line-height: 1.35; }
  .stn-meta { display: block; font-size: 14px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .stn:hover { background: #e6eaee; }
  .stn[aria-current="step"] { background: var(--hl); }
  .stn[aria-current="step"] .stn-yah { display: block; }
  .stn[aria-current="step"] .stn-label { font-weight: 700; }
  .stn[aria-current="step"] .stn-meta { color: var(--ink); }
  .yah { position: absolute; left: 0; top: 0; z-index: 2; width: 36px; height: 36px; display: grid; place-items: center; pointer-events: none; transition: transform 300ms var(--ease); }
  .yah::after { content: ""; width: 20px; height: 20px; border-radius: 50%; background: var(--hl); border: 3px solid var(--ink); box-shadow: 0 0 0 3px var(--hl), 0 2px 6px 3px rgb(34 38 43 / 0.25); }
  .yah.no-anim { transition: none; }

  .ws-center { overflow: auto; background: var(--desk); padding: 18px 32px 110px; }
  .platform { position: sticky; top: 0; z-index: 3; max-width: 780px; margin: 0 auto; padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 10px; background: var(--paper); border-radius: 6px; box-shadow: var(--paper-shadow-sm); }
  .pf-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
  .doc-tabs { display: flex; flex-wrap: wrap; gap: 8px; }
  .doc-tab { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 4px 12px; border-radius: 6px; border: 1px solid var(--rule); background: #e6eaee; color: var(--ink-2); font-size: 15px; cursor: pointer; }
  .doc-tab .code { font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; }
  .doc-tab:hover { background: #eef1f4; }
  .doc-tab[aria-pressed="true"] { background: var(--paper); color: var(--ink); border-color: var(--ink); box-shadow: inset 0 -3px 0 var(--hl); }
  .pf-count { margin-left: auto; color: var(--ink-2); font-size: 15px; font-variant-numeric: tabular-nums; }
  .add-pdf { min-height: 44px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; border-radius: 6px; border: 1.5px dashed #6b7480; background: transparent; color: var(--ink); font-weight: 700; font-size: 15px; cursor: pointer; }
  .add-pdf:hover { border-color: var(--ink); }
  .pages { display: flex; align-items: center; gap: 16px; padding-top: 10px; border-top: 1px solid var(--rule-2); }
  .pages-label { font-weight: 700; font-size: 15.5px; white-space: nowrap; font-variant-numeric: tabular-nums; min-width: 6.5em; }
  .stops { position: relative; flex: 1; display: flex; justify-content: space-between; align-items: center; list-style: none; margin: 0; padding: 0; }
  .stops::before { content: ""; position: absolute; left: 18px; right: 18px; top: 50%; height: 2px; margin-top: -1px; background: var(--ink); }
  .stops li { position: relative; display: grid; place-items: center; width: 44px; height: 44px; }
  .stop { width: 30px; height: 30px; padding: 0; border-radius: 50%; border: 2px solid #9aa3ad; background: var(--paper); color: var(--ink-2); font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; display: grid; place-items: center; cursor: pointer; }
  .stop.has-fields { border-color: var(--ink); color: var(--ink); }
  .stop:hover { background: #eef1f4; }
  .stop[aria-current="page"] { width: 38px; height: 38px; background: var(--hl); color: var(--ink); border: 2.5px solid var(--ink); font-size: 16px; font-weight: 800; }
  .pf-status:empty { display: none; }
  .pf-status { max-width: 780px; margin: 10px auto 0; font-weight: 700; background: #fffbe0; border-radius: 4px; padding: 10px 14px; }
  .sheet-wrap { max-width: 780px; margin: 22px auto 0; }
  .sheet-wrap .form-sheet {
    --fs-font: var(--font);
    --fs-ink: #22262b; --fs-bar: #22262b; --fs-rule: #5d6670;
    --ff-ring: var(--hl-ink); --ff-tint: rgb(255 233 77 / 0.92); --ff-hover: rgb(255 233 77 / 0.30);
    --ff-visited-mark: #22262b; --ff-radius: 2px;
    overflow: visible;
    box-shadow: var(--paper-shadow);
  }
  @media (min-width: 1280px) { .sheet-wrap .form-sheet { font-size: 12px; } }
  .sheet-wrap .ff.is-selected {
    background-color: transparent;
    background-image: linear-gradient(var(--ff-tint), var(--ff-tint));
    background-repeat: no-repeat; background-position: left center; background-size: 100% 100%;
    box-shadow: inset 0 0 0 2px var(--ff-ring);
    animation: fh-swipe 250ms var(--ease) both;
  }
  @keyframes fh-swipe { from { background-size: 0% 100%; } to { background-size: 100% 100%; } }
  .sheet-wrap .ff.is-selected::before { content: ""; position: absolute; left: -8px; top: -8px; z-index: 1; width: 16px; height: 16px; border-radius: 50%; background: var(--hl); border: 3px solid var(--ink); }
  .sheet-wrap .ff.is-visited::after { top: 5px; right: 8px; width: 5px; height: 10px; border-radius: 0; background: none; border: solid var(--ff-visited-mark); border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .sheet-wrap .ff:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }

  .ws-side { display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--rule); background: var(--paper); }
  .tabs { display: flex; gap: 4px; padding: 6px 20px 0; border-bottom: 1px solid var(--rule); }
  .tab { flex: 1; min-height: 48px; margin-bottom: -1px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-bottom: 3px solid transparent; background: none; color: var(--ink-2); font-weight: 700; font-size: 16px; cursor: pointer; }
  .tab .ico { width: 18px; height: 18px; }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
  .tab[aria-selected="false"]:hover { color: var(--ink); background: #f3f5f7; }
  .panel { flex: 1; min-height: 0; overflow: auto; }
  #panel-ask { display: flex; flex-direction: column; overflow: hidden; }

  .psign { margin: 0 24px; padding: 22px 0 20px; display: flex; flex-direction: column; gap: 12px; border-bottom: 1px solid var(--rule-2); }
  .psign-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; }
  .psign-top .lb { border: 0; padding: 0; background: none; font-size: 15px; color: var(--ink-2); white-space: normal; }
  .psign-page { color: var(--ink-2); font-size: 15px; font-variant-numeric: tabular-nums; }
  .psign h2 { font-size: 27px; letter-spacing: -0.01em; }
  .psign h2:focus { outline: none; }
  .psign h2:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
  .psign.empty { flex-direction: row; align-items: flex-start; gap: 12px; border: 0; }
  .psign.empty h2 { font-size: 19px; font-weight: 600; color: var(--ink-2); max-width: 30ch; }
  .req { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; padding: 5px 12px; border: 1.5px solid var(--ink); border-radius: 6px; background: var(--paper); font-weight: 700; font-size: 15.5px; }
  .dirs { display: grid; grid-template-columns: auto 1fr; gap: 8px; margin-top: 4px; }
  .dir { min-height: 48px; padding: 8px 14px; border-radius: 6px; display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15.5px; line-height: 1.25; text-align: left; cursor: pointer; }
  .dir-prev { background: var(--paper); color: var(--ink); border: 1.5px solid #8a939d; }
  .dir-prev:hover:not(:disabled) { border-color: var(--ink); background: #eef1f4; }
  .dir-next { background: var(--hl); color: var(--ink); border: 1.5px solid var(--ink); justify-content: space-between; }
  .dir-next:hover:not(:disabled) { background: var(--hl-2); }
  .dir-k { color: var(--ink-2); font-weight: 600; }
  .dir:disabled { opacity: 0.45; cursor: not-allowed; }

  .fbody { padding: 18px 24px 100px; display: flex; flex-direction: column; gap: 24px; font-size: 17px; }
  .fbody-top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
  .ground { display: inline-flex; align-items: center; gap: 8px; font-size: 15.5px; color: var(--ink-2); }
  .ground.general { color: var(--ink); font-style: italic; }
  .ask-btn { min-height: 40px; display: inline-flex; align-items: center; gap: 8px; padding: 0 12px; border: 1.5px solid var(--ink); border-radius: 6px; background: var(--paper); font-weight: 700; font-size: 15px; cursor: pointer; }
  .ask-btn:hover { background: var(--hl); }
  .fsec h3, .points h3 { font-size: 16px; margin-bottom: 6px; }
  .fsec p { max-width: 62ch; }
  .example { display: inline-block; padding: 3px 10px; background: var(--paper); border: 1px solid var(--rule); border-radius: 4px; font-weight: 700; font-size: 19px; font-variant-numeric: tabular-nums; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; margin: 0; padding: 0; }
  .opts li { border: 1px solid var(--rule); border-radius: 4px; padding: 2px 10px; font-weight: 600; }
  .mist, .points ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .mist li, .points li { display: flex; gap: 10px; align-items: flex-start; }
  .mist .ico, .points .ico { margin-top: 0.2em; width: 18px; height: 18px; }
  .points { border-left: 4px solid var(--hl); padding: 2px 0 2px 16px; }
  .src-list { list-style: none; margin: 0; padding: 0; }
  .src { display: flex; flex-direction: column; gap: 2px; padding: 8px 0; border-top: 1px solid var(--rule-2); }
  .src:first-child { border-top: 0; padding-top: 2px; }
  .src a { font-weight: 600; }
  .src-note, .src-date { color: var(--ink-2); font-size: 15px; font-variant-numeric: tabular-nums; }

  .desk { margin: 0 20px; padding: 16px 0 12px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--rule-2); }
  .desk .pict { display: none; }
  .desk h2 { font-size: 19px; }
  .desk p { color: var(--ink-2); font-size: 15px; }
  .log { flex: 1; min-height: 0; overflow: auto; padding: 16px 20px; display: flex; flex-direction: column; gap: 18px; font-size: 16.5px; }
  .msg-a { display: flex; flex-direction: column; gap: 8px; }
  .msg-a h3 { font-size: 18px; }
  .msg-a ul { margin: 0; padding-left: 1.3em; }
  .msg-a dl { margin: 0; display: flex; flex-direction: column; gap: 10px; }
  .msg-a dt { font-weight: 800; }
  .msg-a dd { margin: 0; }
  .msg-dept { color: var(--ink-2); font-size: 15px; }
  .msg-tag { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; color: var(--ink-2); }
  .msg-u { align-self: flex-end; max-width: 85%; padding: 10px 14px; border-radius: 10px 10px 2px 10px; background: #eef1f4; color: var(--ink); }
  .msg-u small { display: block; color: var(--ink-2); font-size: 14px; font-weight: 700; }
  .refs { display: flex; flex-wrap: wrap; gap: 6px; }
  .ref { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 4px 12px 4px 10px; border: 1.5px solid var(--ink); border-radius: 999px; background: var(--paper); font-weight: 600; font-size: 15px; cursor: pointer; text-align: left; }
  .ref .d { flex: none; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--ink); background: var(--paper); }
  .ref:hover { background: var(--hl); }
  .thinking { display: flex; align-items: center; gap: 8px; font-style: italic; color: var(--ink-2); padding: 4px 2px; }
  .suggest { display: flex; flex-wrap: wrap; gap: 6px; padding: 12px 20px 10px; border-top: 1px solid var(--rule-2); }
  .chip { min-height: 40px; padding: 4px 12px; border-radius: 999px; border: 1px solid #8a939d; background: var(--paper); color: var(--ink); font-weight: 600; font-size: 15px; cursor: pointer; text-align: left; }
  .chip:hover { background: var(--hl); border-color: var(--ink); }
  .compose { padding: 0 20px 14px; display: flex; flex-direction: column; gap: 8px; background: var(--paper); }
  .ctx { display: flex; align-items: center; gap: 8px; padding: 4px 4px 4px 12px; border-radius: 6px; background: var(--hl); font-size: 15px; }
  .ctx b { font-weight: 800; }
  .ctx button { margin-left: auto; min-height: 36px; padding: 0 10px; border-radius: 4px; border: 1.5px solid var(--ink); background: var(--paper); font-weight: 700; cursor: pointer; }
  .compose-row { display: flex; gap: 8px; }
  .compose input { flex: 1; min-width: 0; min-height: 48px; padding: 0 14px; border: 1.5px solid #6b7480; border-radius: 6px; font: inherit; color: var(--ink); }
  .send { min-height: 48px; padding: 0 14px; border: 1.5px solid var(--ink); border-radius: 6px; background: var(--hl); color: var(--ink); font-weight: 700; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .send:hover { background: var(--hl-2); }
  .send:disabled { opacity: 0.55; cursor: progress; }
  .disclose { display: flex; flex-direction: column; gap: 4px; font-size: 14.5px; line-height: 1.45; color: var(--ink-2); }
  .disclose > span { display: flex; gap: 8px; align-items: flex-start; }
  .disclose .ico { color: var(--ink); margin-top: 0.15em; width: 16px; height: 16px; }

  /* ---------------- Responsive ---------------- */
  @media (max-width: 1100px) {
    .l-grid, .finder { grid-template-columns: 1fr; }
    .l-col.right { flex-direction: column; }
    .l-grid { gap: 32px; }
  }
  @media (max-width: 1080px) {
    .ws { display: block; }
    .ws-route { overflow-x: auto; overflow-y: hidden; border-right: 0; border-bottom: 1px solid var(--rule); padding: 14px 0 10px; }
    .route-head { flex-direction: row; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; padding: 0 16px 8px; position: sticky; left: 0; }
    .track { width: max-content; padding: 0 16px; }
    .track-inner { display: flex; }
    .sec-head { padding: 0 12px 8px 0; }
    .sec-head::before { display: none; }
    .sec ol { display: flex; }
    .stn { width: 136px; min-height: 0; padding: 44px 8px 8px; text-align: center; }
    .stn::before { left: 0; right: 0; top: 22px; bottom: auto; width: auto; height: 2px; }
    .stn.is-first::before { top: 22px; left: 68px; }
    .stn.is-last::before { top: 22px; height: 2px; right: 68px; }
    .stn .dot { left: 61px; top: 16px; }
    .stn-label { font-size: 15px; }
    .ws-center { overflow: visible; padding: 12px 12px 24px; }
    .platform { position: static; }
    .sheet-wrap .form-sheet { aspect-ratio: auto; }
    .ws-side { border-left: 0; border-top: 1px solid var(--rule); }
    .panel, #panel-ask { overflow: visible; }
    .log { overflow: visible; }
    .fbody { padding-bottom: 32px; }
    .compose { padding-bottom: 96px; }
  }
  @media (max-width: 640px) {
    .hdr { padding: 8px 14px; }
    .hdr-notice { order: 3; width: 100%; margin: 0; }
    .brand { margin-right: auto; }
    .landing { padding: 24px 16px 110px; }
    .hero-sign h1 { font-size: 2.1rem; }
    .hero-sign p { font-size: 17px; }
    .ticket-head { padding: 16px 16px 0; }
    .ticket-body { padding: 12px 16px 18px; }
    .map { padding: 16px 14px; }
    .board { padding: 18px 16px 6px; }
    .board-row { grid-template-columns: 1fr auto; grid-template-areas: "code lang" "title title" "open open"; }
    .board-code { grid-area: code; }
    .board-lang { grid-area: lang; justify-self: end; }
    .board-title { grid-area: title; }
    .board-open { grid-area: open; width: 100%; }
    .finder { margin-top: 64px; }
    .finder-sign h2 { font-size: 24px; }
    .svc { grid-template-columns: 1fr auto; }
    .svc .lb-stack { grid-column: 1 / -1; }
    .pf-count { margin-left: 0; }
    .pages { flex-direction: column; align-items: stretch; gap: 8px; }
    .stops li { width: 40px; height: 44px; }
    .stop { width: 30px; height: 30px; }
    .stop[aria-current="page"] { width: 36px; height: 36px; }
    .sheet-wrap .form-sheet { font-size: 10.5px; padding: 16px 14px; }
    .sheet-wrap .ff { min-height: 44px; }
    .sheet-wrap .fs-4, .sheet-wrap .fs-3 { grid-template-columns: 1fr 1fr; }
    .psign { margin: 0 16px; padding: 18px 0 16px; }
    .psign h2 { font-size: 23px; }
    .dirs { grid-template-columns: 1fr; }
    .fbody { padding: 16px 16px 32px; }
    .tabs { padding: 4px 12px 0; }
    .desk { margin: 0 16px; }
    .log, .suggest { padding-left: 16px; padding-right: 16px; }
    .compose { padding-left: 16px; padding-right: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .yah { transition: none; }
    .sheet-wrap .ff.is-selected { animation: none; }
  }
</style>
</head>
<body>
<header class="hdr">
  <a class="brand" href="#landing" id="brand">
    <svg width="34" height="20" viewBox="0 0 34 20" aria-hidden="true" focusable="false"><path d="M3 10h28" stroke="#22262b" stroke-width="2" stroke-linecap="round"/><circle cx="17" cy="10" r="6" fill="#ffe94d" stroke="#22262b" stroke-width="2.5"/></svg>
    <span data-i18n="brand"></span>
  </a>
  <p class="hdr-notice"><span class="pict sm" data-ico="info" aria-hidden="true"></span><span data-i18n="notOfficial"></span></p>
  <button class="lang-btn" id="langBtn" type="button"></button>
</header>

<main id="main">
  <!-- ================= LANDING ================= -->
  <div class="landing" data-view-panel="landing">
    <div class="l-grid">
      <div class="l-col">
        <section class="hero-sign on-dark" aria-labelledby="heroTitle">
          <span class="pict inv" data-ico="arrowDown" aria-hidden="true"></span>
          <div>
            <h1 id="heroTitle" data-i18n="heroTitle"></h1>
            <p data-i18n="heroSub"></p>
          </div>
        </section>

        <section class="ticket" aria-labelledby="ticketTitle">
          <div class="ticket-head on-dark">
            <span class="pict inv sm" data-ico="arrowR" aria-hidden="true"></span>
            <h2 id="ticketTitle" data-i18n="startHere"></h2>
          </div>
          <div class="ticket-body">
            <label class="drop" id="drop">
              <input type="file" id="fileIn" accept="application/pdf,.pdf" multiple>
              <span class="pict" data-ico="upload" aria-hidden="true"></span>
              <strong data-i18n="uploadTitle"></strong>
              <span class="hint" data-i18n="uploadHint"></span>
            </label>
            <ul class="limits" id="limits"></ul>
            <p class="status" id="uploadStatus" role="status"></p>
            <p class="supported"><span class="pict sm" data-ico="check" aria-hidden="true"></span><span data-i18n="supported"></span></p>
            <p class="notice"><span class="pict" data-ico="lock" aria-hidden="true"></span><span data-i18n="privacy"></span></p>
            <p class="notice"><span class="pict" data-ico="chip" aria-hidden="true"></span><span data-i18n="aiDisclosure"></span></p>
          </div>
        </section>
      </div>

      <div class="l-col right">
        <section class="board on-dark" aria-labelledby="boardTitle">
          <div class="board-head">
            <span class="pict inv" data-ico="doc" aria-hidden="true"></span>
            <h2 id="boardTitle" data-i18n="sampleTitle"></h2>
          </div>
          <ul class="board-rows" id="boardRows"></ul>
        </section>

        <section class="map" id="map" aria-labelledby="mapTitle">
          <div class="map-head">
            <h2 id="mapTitle" data-i18n="mapTitle"></h2>
            <p data-i18n="mapHint"></p>
          </div>
          <div class="map-stage" id="mapStage"></div>
          <ul class="legend" id="legend"></ul>
          <p class="map-note" id="mapNote"></p>
        </section>
      </div>
    </div>

    <section class="finder" aria-labelledby="finderTitle">
      <div class="finder-sign">
        <h2 id="finderTitle"><span class="pict" data-ico="signpost" aria-hidden="true"></span><span data-i18n="serviceTitle"></span></h2>
        <p data-i18n="serviceSub"></p>
        <form class="finder-form" id="finderForm" role="search">
          <label for="svcQ" data-i18n="search"></label>
          <input id="svcQ" type="search" data-i18n-ph="servicePh" autocomplete="off">
          <button type="submit" class="btn-dark"><span data-ico="search" class="ico-slot" aria-hidden="true"></span><span data-i18n="go"></span></button>
        </form>
      </div>
      <ul class="svc-list" id="svcList"></ul>
    </section>

    <footer class="l-foot">
      <p class="notice"><span class="pict" data-ico="info" aria-hidden="true"></span><span data-i18n="notOfficialLong"></span></p>
    </footer>
  </div>

  <!-- ================= WORKSPACE ================= -->
  <div class="ws" data-view-panel="workspace">
    <nav class="ws-route" id="route" aria-labelledby="routeTitle">
      <div class="route-head">
        <h2 id="routeTitle" data-i18n="fieldsTitle"></h2>
        <p class="route-count" id="routeCount"></p>
      </div>
      <div class="track" id="track">
        <div class="track-inner" id="routeInner"></div>
        <span class="yah no-anim" id="yah" aria-hidden="true" hidden></span>
      </div>
    </nav>

    <section class="ws-center" aria-labelledby="docTitle">
      <h2 class="sr-only" id="docTitle"></h2>
      <div class="platform on-dark">
        <div class="pf-row">
          <div class="doc-tabs" id="docTabs" role="group" aria-labelledby="docCount"></div>
          <span class="pf-count" id="docCount"></span>
          <button type="button" class="add-pdf" id="addPdf"><span data-ico="plus" aria-hidden="true"></span><span data-i18n="addPdf"></span></button>
          <input type="file" id="addFile" accept="application/pdf,.pdf" hidden>
        </div>
        <div class="pages">
          <span class="pages-label" id="pagesLabel"></span>
          <ul class="stops" id="stops"></ul>
        </div>
      </div>
      <p class="pf-status" id="pfStatus" role="status"></p>
      <div class="sheet-wrap" id="sheet"></div>
    </section>

    <section class="ws-side" id="side">
      <div class="tabs" role="tablist" id="tabs">
        <button type="button" role="tab" class="tab" id="tab-field" data-tab="field" aria-controls="panel-field" aria-selected="true"><span data-ico="signpost" aria-hidden="true"></span><span data-i18n="tabField"></span></button>
        <button type="button" role="tab" class="tab" id="tab-ask" data-tab="ask" aria-controls="panel-ask" aria-selected="false" tabindex="-1"><span data-ico="info" aria-hidden="true"></span><span data-i18n="tabAsk"></span></button>
      </div>
      <div class="panel" id="panel-field" role="tabpanel" aria-labelledby="tab-field" tabindex="0"></div>
      <div class="panel" id="panel-ask" role="tabpanel" aria-labelledby="tab-ask" hidden>
        <div class="desk on-dark">
          <span class="pict inv" data-ico="info" aria-hidden="true"></span>
          <div><h2 data-i18n="infoDesk"></h2><p data-i18n="chatTitle"></p></div>
        </div>
        <div class="log" id="chatLog" role="log" aria-labelledby="tab-ask"></div>
        <div class="suggest" id="suggest"></div>
        <form class="compose" id="compose">
          <div class="ctx" id="ctxChip" hidden></div>
          <label for="chatIn" class="sr-only" data-i18n="chatTitle"></label>
          <div class="compose-row">
            <input id="chatIn" type="text" data-i18n-ph="chatPh" autocomplete="off">
            <button type="submit" class="send" id="sendBtn"><span data-i18n="send"></span><span data-ico="arrowR" aria-hidden="true"></span></button>
          </div>
          <div class="disclose">
            <span><span data-ico="lock" aria-hidden="true"></span><span data-i18n="privacy"></span></span>
            <span><span data-ico="chip" aria-hidden="true"></span><span data-i18n="aiDisclosure"></span></span>
          </div>
        </form>
      </div>
    </section>
  </div>
</main>

<script src="shared/data.js"></script>
<script src="shared/proto.js"></script>
<script>
(function () {
  const D = FH.data;
  const esc = FH.esc;
  const $ = (s, r = document) => r.querySelector(s);
  const t = (k, v) => esc(FH.t(k, v));

  /* Design-specific copy, added to the shared dictionary so FH.t and data-i18n handle it. */
  Object.assign(D.i18n.en, {
    youAreHere: "You are here",
    nextLabel: "Next:",
    prevShort: "Previous",
    endOfLine: "Last field",
    tabField: "Field",
    tabAsk: "Ask",
    infoDesk: "Questions",
    startHere: "Start here",
    lineP: "Passport",
    lineB: "Benefits",

    interchange: "Interchange",
    mapTitle: "Service map",

  });
  Object.assign(D.i18n.fr, {
    youAreHere: "Vous êtes ici",
    nextLabel: "Suivant :",
    prevShort: "Précédent",
    endOfLine: "Dernier champ",
    tabField: "Champ",
    tabAsk: "Demander",
    infoDesk: "Questions",
    startHere: "Commencez ici",
    lineP: "Passeport",
    lineB: "Prestations",
    lineT: "Impôt · ARC",
    interchange: "Correspondance",
    mapTitle: "Plan des services",
    mapHint: "Chaque arrêt ouvre une page officielle.",

    uploadProto: "Prototype : ce fichier n'est pas traité. Ouvrez un formulaire exemple pour explorer.",
    addProto: "Prototype : l'ajout de fichiers n'est pas encore offert.",
  });

  /* ---------- Pictograms ---------- */
  const P = {
    info: '<circle cx="12" cy="12" r="9.5"/><path d="M12 11v6M12 7.5v.01"/>',
    lock: '<rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/>',
    chip: '<rect x="6.5" y="6.5" width="11" height="11" rx="2"/><path d="M9.5 3v3.5M14.5 3v3.5M9.5 17.5V21M14.5 17.5V21M3 9.5h3.5M3 14.5h3.5M17.5 9.5H21M17.5 14.5H21"/>',

    person: '<circle cx="12" cy="8" r="3.5"/><path d="M5 20.5c.8-4 3.6-6 7-6s6.2 2 7 6"/>',
    upload: '<path d="M12 15V4M7 9l5-5 5 5"/><path d="M4 15v4.5h16V15"/>',
    doc: '<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4M9 12h6M9 16h6"/>',
    ext: '<path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v6H4V6h6"/>',

    plus: '<path d="M12 5v14M5 12h14"/>',
    signpost: '<path d="M12 3v18M12 5h7l2 2.5-2 2.5h-7M12 12H5l-2 2.5L5 17h7"/>',

  const ico = (n) => `<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${P[n]}</svg>`;
  const pict = (n, cls = "") => `<span class="pict ${cls}" aria-hidden="true">${ico(n)}</span>`;
  document.querySelectorAll("[data-ico]").forEach((el) => { el.innerHTML = ico(el.dataset.ico); });

  /* ---------- Lines ---------- */
  const LINES = {
    P: { hex: "#22262b", dash: "", key: "lineP" },
    B: { hex: "#22262b", dash: "10 7", key: "lineB" },

  const SEC_C = { personal: "#22262b", travel: "#22262b", guarantor: "#22262b" };
  const lb = (L) => `<span class="lb ${L === "T" ? "tax" : ""}" style="--c:${LINES[L].hex}">${t(LINES[L].key)}</span>`;

  /* ================= LANDING ================= */
  const STN = {
    passports: ["P"], sin: ["P", "B"], ei: ["B"], ccb: ["B", "T"], cpp: ["B"], oas: ["B"], "cra-sign-in": ["T"],
  };
  const MAPS = {
    wide: {
      w: 760, h: 400,
      pos: {
        passports: [90, 80, "right"], sin: [90, 230, "below"], ei: [290, 230, "below"], ccb: [470, 230, "above-end"],
        cpp: [570, 300, "below"], oas: [700, 300, "above"], "cra-sign-in": [680, 150, "above"],
      },
      paths: { P: [[90, 80], [90, 230]], B: [[90, 230], [470, 230], [540, 300], [700, 300]], T: [[470, 230], [550, 150], [680, 150]] },
    },
    tall: {

      pos: {
        passports: [36, 40, "right"], sin: [36, 140, "right"], ei: [36, 240, "right"], ccb: [36, 340, "right-up"],

      },
      paths: { P: [[36, 40], [36, 140]], B: [[36, 140], [36, 590]], T: [[36, 340], [96, 400], [96, 430]] },

  let mapKey = null;

    const svg = `<svg viewBox="0 0 ${M.w} ${M.h}" aria-hidden="true" focusable="false">${Object.entries(M.paths).map(([L, pts]) =>
      `<polyline points="${pts.map((p) => p.join(",")).join(" ")}" fill="none" stroke="#22262b" stroke-width="3"${LINES[L].dash ? ` stroke-dasharray="${LINES[L].dash}"` : ""} stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>`).join("")}</svg>`;
    const links = D.services.map((s) => {

      const lines = STN[s.id];
      return `<a class="stn-link at-${at} ${lines.length > 1 ? "is-x" : ""}" data-svc="${s.id}" href="${r.url}" target="_blank" rel="noopener" style="left:${(x / M.w) * 100}%;top:${(y / M.h) * 100}%;--c:${LINES[lines[0]].hex}"><span class="dot" aria-hidden="true"></span><span class="lab">${esc(s[FH.lang])}${r.note ? `<span class="sr-only"> (${esc(r.note)})</span>` : ""}</span></a>`;
    }).join("");

  function renderLegend() {
    $("#legend").innerHTML = ["P", "B", "T"].map((L) => `<li><svg width="34" height="8" viewBox="0 0 34 8" aria-hidden="true" focusable="false"><line x1="3" y1="4" x2="31" y2="4" stroke="#22262b" stroke-width="3" stroke-linecap="round"${LINES[L].dash ? ` stroke-dasharray="${LINES[L].dash}"` : ""}/></svg>${t(LINES[L].key)}</li>`).join("")
      + `<li><i class="x" aria-hidden="true"></i>${t("interchange")}</li>`;
    $("#mapNote").textContent = FH.lang === "fr" ? FH.t("sourceLang") : "";
  }

  const norm = (s) => String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
  const STOP = new Set(["the", "and", "for", "my", "to", "of", "an", "get", "how", "what", "need", "do", "want", "with",
    "je", "le", "la", "les", "de", "des", "du", "un", "une", "mon", "ma", "mes", "pour", "et", "que", "faire", "veux", "en", "au"]);
  function matches(s, q) {
    const toks = norm(q).split(/[^a-z0-9]+/).filter((x) => x.length >= 2 && !STOP.has(x));
    if (!toks.length) return true;
    const r = D.resources[s.id];
    const hay = norm([s.en, s.fr, r.en, r.fr, s.dept].join(" "));
    return toks.some((x) => hay.includes(x));
  }
  const query = () => $("#svcQ").value.trim();
  function applyMapFilter() {
    const q = query();
    document.querySelectorAll(".stn-link").forEach((a) => {
      const s = D.services.find((x) => x.id === a.dataset.svc);
      const m = !!q && matches(s, q);
      a.classList.toggle("is-match", m);
      a.classList.toggle("is-dim", !!q && !m);
    });
  }
  function renderServices() {
    const q = query();
    const list = q ? D.services.filter((s) => matches(s, q)) : D.services;
    $("#svcList").innerHTML = list.length ? list.map((s) => {
      const r = FH.resource(s.id);
      return `<li><a class="svc" href="${r.url}" target="_blank" rel="noopener">
        <span class="lb-stack">${STN[s.id].map(lb).join("")}</span>
        <span><span class="svc-name">${esc(s[FH.lang])}</span><span class="svc-src">${esc(r.title)}${r.note ? ` · ${esc(r.note)}` : ""}</span></span>
        <span class="svc-end"><span class="svc-dept">${esc(s.dept)}</span>${ico("ext")}</span></a></li>`;
    }).join("") : `<li class="no-match" role="status">${t("noMatch")}</li>`;
    applyMapFilter();
  }
  function renderBoard() {
    const rows = [
      { doc: "pptc153", key: "sampleEn", lang: "en", tag: "EN" },
      { doc: "pptc154", key: "sampleFr", lang: "fr", tag: "FR" },
    ];
    $("#boardRows").innerHTML = rows.map((r) => {
      const d = D.docs.find((x) => x.id === r.doc);
      const title = FH.t(r.key);
      return `<li class="board-row">
        <span class="board-code">${esc(d.number)}</span>
        <span class="board-title" lang="${r.lang}">${esc(title)}</span>
        <span class="board-lang" lang="${r.lang}">${r.tag}</span>
        <button type="button" class="board-open" data-sample="${r.doc}" aria-label="${t("openSample")}: ${esc(title)} (${esc(d.number)})"><span>${t("openSample")}</span>${ico("arrowR")}</button>
      </li>`;
    }).join("");
  }
  let uploadKey = "";
  let addKey = "";
  function renderLanding() {
    $("#limits").innerHTML = FH.t("limits").split(" · ").map((x) => `<li>${esc(x)}</li>`).join("");
    $("#uploadStatus").textContent = uploadKey ? FH.t(uploadKey) : "";
    renderBoard();
    renderLegend();
    renderMap(true);
    renderServices();
  }

  $("#boardRows").addEventListener("click", (e) => {
    const b = e.target.closest("[data-sample]");
    if (!b) return;
    FH.setDoc(b.dataset.sample);
    FH.showView("workspace");
  });
  const drop = $("#drop");
  ["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("is-over"); }));
  ["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, (e) => {
    e.preventDefault();
    drop.classList.remove("is-over");
    if (ev === "drop") { uploadKey = "uploadProto"; $("#uploadStatus").textContent = FH.t(uploadKey); }
  }));
  $("#fileIn").addEventListener("change", (e) => {
    if (!e.target.files.length) return;
    uploadKey = "uploadProto";
    $("#uploadStatus").textContent = FH.t(uploadKey);
    e.target.value = "";
  });
  $("#svcQ").addEventListener("input", renderServices);
  $("#finderForm").addEventListener("submit", (e) => { e.preventDefault(); renderServices(); });
  if ("ResizeObserver" in window) new ResizeObserver(() => renderMap(false)).observe($("#mapStage"));

  /* ================= WORKSPACE ================= */
  const routeEl = $("#route");
  const track = $("#track");
  const routeInner = $("#routeInner");
  const yah = $("#yah");
  const horizontal = window.matchMedia("(max-width: 1080px)");

  function renderRoute() {
    const secs = FH.sectionsInOrder();
    const total = D.fields.length;
    let i = 0;
    routeInner.innerHTML = secs.map((s) => {
      const c = SEC_C[s.id];
      const stations = s.fields.map((f) => {
        const cls = `${i === 0 ? " is-first" : ""}${i === total - 1 ? " is-last" : ""}`;
        i++;
        return `<li><button type="button" class="stn${cls}" data-id="${f.id}">
          <span class="dot" aria-hidden="true"></span>
          <span class="stn-yah">${t("youAreHere")}</span>
          <span class="stn-label">${esc(f.label)}</span>
          <span class="stn-meta">${t("page")} ${f.page}<span class="sr-only stn-vis"></span></span>
        </button></li>`;
      }).join("");
      return `<div class="sec" style="--c:${c}"><div class="sec-head"><span class="lb ${s.id === "travel" ? "outline" : ""}" style="--c:${c}">${esc(s.label)}</span></div><ol>${stations}</ol></div>`;
    }).join("");
    updateRoute(false);
  }
  function updateRoute(animate) {
    const sel = FH.state.selectedId;
    routeInner.querySelectorAll(".stn").forEach((b) => {
      const id = b.dataset.id;
      const v = FH.state.visited.has(id);
      b.classList.toggle("is-visited", v);
      b.querySelector(".stn-vis").textContent = v ? `, ${FH.t("viewed")}` : "";
      if (id === sel) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
    });
    $("#routeCount").textContent = `${FH.state.visited.size}/${D.fields.length} ${FH.t("viewed")}`;
    placeMarker(animate);
  }
  function placeMarker(animate) {
    const sel = FH.state.selectedId;
    const btn = sel ? routeInner.querySelector(`.stn[data-id="${sel}"]`) : null;
    if (!btn) { yah.hidden = true; return; }
    if (!btn.offsetParent) return; // workspace hidden; re-placed when shown
    const wasHidden = yah.hidden;
    yah.hidden = false;
    const d = btn.querySelector(".dot").getBoundingClientRect();
    const tr = track.getBoundingClientRect();
    const x = d.left + d.width / 2 - tr.left - 18;
    const y = d.top + d.height / 2 - tr.top - 18;
    const anim = animate && !wasHidden;
    yah.classList.toggle("no-anim", !anim);
    yah.style.setProperty("--c", SEC_C[FH.field(sel).section]);
    yah.style.transform = `translate(${x}px, ${y}px)`;
    if (!anim) { void yah.offsetWidth; requestAnimationFrame(() => yah.classList.remove("no-anim")); }
    scrollRouteTo(btn);
  }
  function scrollRouteTo(btn) {
    const b = btn.getBoundingClientRect();
    const s = routeEl.getBoundingClientRect();
    if (horizontal.matches) {
      if (b.left < s.left + 16 || b.right > s.right - 16) routeEl.scrollLeft += b.left - s.left - (s.width - b.width) / 2;
    } else if (b.top < s.top + 72 || b.bottom > s.bottom - 72) {
      routeEl.scrollTop += b.top - s.top - (s.height - b.height) / 2;
    }
  }
  routeInner.addEventListener("click", (e) => {
    const b = e.target.closest(".stn");
    if (b) FH.select(b.dataset.id);
  });
  routeInner.addEventListener("keydown", (e) => {
    const keys = ["ArrowDown", "ArrowUp", "ArrowRight", "ArrowLeft", "Home", "End"];
    if (!keys.includes(e.key)) return;
    const btns = [...routeInner.querySelectorAll(".stn")];
    const i = btns.indexOf(document.activeElement);
    if (i < 0) return;
    e.preventDefault();
    const j = e.key === "Home" ? 0 : e.key === "End" ? btns.length - 1
      : (e.key === "ArrowDown" || e.key === "ArrowRight") ? Math.min(btns.length - 1, i + 1) : Math.max(0, i - 1);
    btns[j].focus();
  });

  function renderPlatform() {
    const doc = FH.doc();
    $("#docTitle").textContent = `${doc.number} · ${doc.title[FH.lang]}`;
    $("#docTabs").innerHTML = D.docs.map((d) =>
      `<button type="button" class="doc-tab" data-doc="${d.id}" aria-pressed="${d.id === FH.state.docId}"><span class="code">${esc(d.number)}</span><span>${esc(d.short[FH.lang])}</span></button>`).join("");
    $("#docCount").textContent = FH.t("docsCount", { n: D.docs.length });
    $("#pfStatus").textContent = addKey ? FH.t(addKey) : "";
    renderStops();
  }
  function renderStops() {
    const doc = FH.doc();
    const p = FH.state.page;
    const withFields = new Set(D.fields.map((f) => f.page));
    $("#pagesLabel").textContent = `${FH.t("page")} ${p} ${FH.t("of")} ${doc.pages}`;
    $("#stops").innerHTML = Array.from({ length: doc.pages }, (_, k) => k + 1).map((n) =>
      `<li><button type="button" class="stop ${withFields.has(n) ? "has-fields" : ""}" data-page="${n}" ${n === p ? 'aria-current="page"' : ""} aria-label="${t("page")} ${n} ${t("of")} ${doc.pages}">${n}</button></li>`).join("");
  }
  $("#docTabs").addEventListener("click", (e) => {
    const b = e.target.closest("[data-doc]");
    if (b && b.dataset.doc !== FH.state.docId) FH.setDoc(b.dataset.doc);
  });
  $("#stops").addEventListener("click", (e) => {
    const b = e.target.closest("[data-page]");
    if (!b) return;
    FH.setPage(Number(b.dataset.page));
    const nb = $(`#stops [data-page="${b.dataset.page}"]`);
    if (nb) nb.focus();
  });
  $("#addPdf").addEventListener("click", () => $("#addFile").click());
  $("#addFile").addEventListener("change", (e) => {
    if (!e.target.files.length) return;
    addKey = "addProto";
    $("#pfStatus").textContent = FH.t(addKey);
    e.target.value = "";
  });

  /* ---------- Platform sign (field explanation) ---------- */
  const sec = (key, inner) => (inner ? `<section class="fsec"><h3>${t(key)}</h3>${inner}</section>` : "");
  const para = (s) => (s ? `<p>${esc(s)}</p>` : "");
  function renderSign() {
    const panel = $("#panel-field");
    const keep = document.activeElement && panel.contains(document.activeElement) ? document.activeElement.dataset.step : null;
    const f = FH.state.selectedId ? FH.field(FH.state.selectedId) : null;
    if (!f) {
      panel.innerHTML = `<div class="psign empty on-dark">${pict("signpost", "inv")}<h2>${t("selectPrompt")}</h2></div>`;
      return;
    }
    const all = D.fields;
    const prev = f.index > 0 ? FH.field(all[f.index - 1].id) : null;
    const next = f.index < all.length - 1 ? FH.field(all[f.index + 1].id) : null;
    const c = SEC_C[f.section];
    const doc = FH.doc();
    panel.innerHTML = `
      <div class="psign on-dark">
        <div class="psign-top">
          <span class="lb" style="--c:${c}">${esc(f.sectionLabel)}</span>
          <span class="psign-page">${t("page")} ${f.page} ${t("of")} ${doc.pages}</span>
        </div>
        <h2 id="fieldTitle" tabindex="-1"><span class="hl">${esc(f.label)}</span></h2>
        ${f.bold ? `<p class="req">${ico("person")}<span>${t("required")}</span></p>` : ""}
        <div class="dirs">
          <button type="button" class="dir dir-prev" data-step="-1" ${prev ? `aria-label="${t("prev")}: ${esc(prev.label)}"` : "disabled"}>${ico("arrowL")}<span>${t("prevShort")}</span></button>
          <button type="button" class="dir dir-next" data-step="1" ${next ? "" : "disabled"}>${next
            ? `<span><span class="dir-k">${t("nextLabel")}</span> ${esc(next.label)}</span>`
            : `<span>${t("endOfLine")}</span>`}${ico("arrowR")}</button>
        </div>
      </div>
      <div class="fbody">
        <div class="fbody-top">
          <p class="ground ${f.grounded ? "" : "general"}">${pict(f.grounded ? "check" : "warn", "sm")}<span>${t(f.grounded ? "grounded" : "general")}</span></p>
          <button type="button" class="ask-btn" data-ask>${ico("info")}<span>${t("askField")}</span></button>
        </div>
        ${sec("meaning", para(f.meaning))}
        ${sec("enter", para(f.enter))}
        ${sec("example", f.example ? `<p class="example">${esc(f.example)}</p>` : "")}
        ${sec("options", f.options ? `<ul class="opts">${f.options.map((o) => `<li>${esc(o)}</li>`).join("")}</ul>` : "")}
        ${sec("find", para(f.find))}
        ${f.points ? `<section class="points"><h3>${esc(f.points.title)}</h3><ul>${f.points.items.map((x) => `<li>${ico("check")}<span>${esc(x)}</span></li>`).join("")}</ul></section>` : ""}
        ${sec("mistakes", f.mistakes.length ? `<ul class="mist">${f.mistakes.map((m) => `<li>${ico("cross")}<span>${esc(m)}</span></li>`).join("")}</ul>` : "")}
        ${sec("sources", FH.sourceList(f.sources, "src"))}
      </div>`;
    if (keep) {
      const b = panel.querySelector(`[data-step="${keep}"]`);
      (b && !b.disabled ? b : $("#fieldTitle")).focus();
    }
  }
  $("#panel-field").addEventListener("click", (e) => {
    const s = e.target.closest("[data-step]");
    if (s) { FH.step(Number(s.dataset.step)); return; }
    if (e.target.closest("[data-ask]")) askAboutField();
  });

  /* ---------- Tabs ---------- */
  function setTab(name, focus) {
    document.querySelectorAll(".tab").forEach((b) => {
      const on = b.dataset.tab === name;
      b.setAttribute("aria-selected", String(on));
      b.tabIndex = on ? 0 : -1;
    });
    $("#panel-field").hidden = name !== "field";
    $("#panel-ask").hidden = name !== "ask";
    if (focus) $(`.tab[data-tab="${name}"]`).focus();
    if (name === "ask") scrollLog();
  }
  $("#tabs").addEventListener("click", (e) => { const b = e.target.closest(".tab"); if (b) setTab(b.dataset.tab); });
  $("#tabs").addEventListener("keydown", (e) => {
    if (!["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)) return;
    e.preventDefault();
    const cur = document.activeElement.dataset.tab;
    setTab(e.key === "Home" ? "field" : e.key === "End" ? "ask" : cur === "field" ? "ask" : "field", true);
  });

  /* ---------- Information desk (chat) ---------- */
  const chat = [
    { kind: "overview" },
    { role: "user", key: "suggestion1" },
    { role: "assistant", q: "guarantor" },
  ];
  let askCtx = null;
  let thinking = false;
  const log = $("#chatLog");
  const ctxHint = (id) => (id.startsWith("g-") ? "guarantor" : id === "dob" ? "birth" : id);
  function answer(m) {
    let r = FH.reply(m.key ? FH.t(m.key) : m.q);
    const generic = !r.refs.length && r.sources.length === 1 && r.sources[0].id === "passports";
    if (m.ctx && generic) r = FH.reply(ctxHint(m.ctx));
    return r;
  }
  const tag = () => `<p class="msg-tag">${ico("info")}<span>${t("protoReply")}</span></p>`;
  const refChip = (id) => {
    const f = FH.field(id);
    return `<button type="button" class="ref" data-ref="${id}" style="--c:${SEC_C[f.section]}"><span class="d" aria-hidden="true"></span>${esc(f.label)}</button>`;
  };
  function msgHTML(m) {
    if (m.kind === "overview") {
      const o = FH.overview();
      return `<article class="msg msg-a">${tag()}
        <h3>${t("overviewTitle")}: ${esc(o.title)}</h3>
        <p class="msg-dept">${esc(o.department)}</p>
        <p>${esc(o.summary)}</p>
        <dl>
          <div><dt>${t("who")}</dt><dd>${esc(o.who)}</dd></div>
          <div><dt>${t("need")}</dt><dd><ul>${o.need.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></dd></div>
          <div><dt>${t("submit")}</dt><dd>${esc(o.submit)}</dd></div>
        </dl>
        ${FH.sourceList(o.sources, "src")}
      </article>`;
    }
    if (m.role === "user") {
      const f = m.ctx ? FH.field(m.ctx) : null;
      return `<div class="msg msg-u">${f ? `<small>${t("askingAbout")}: ${esc(f.label)}</small>` : ""}${esc(m.key ? FH.t(m.key) : m.text)}</div>`;
    }
    const r = answer(m);
    return `<article class="msg msg-a">${tag()}
      <p>${esc(r.text)}</p>
      ${r.list ? `<ul>${r.list.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
      ${r.refs.length ? `<div class="refs">${r.refs.map(refChip).join("")}</div>` : ""}
      ${FH.sourceList(r.sources, "src")}
    </article>`;
  }
  const thinkingHTML = () => `<div class="thinking">${ico("clock")}<span>${t("thinking")}</span></div>`;
  function renderChat() {
    log.innerHTML = chat.map(msgHTML).join("") + (thinking ? thinkingHTML() : "");
  }
  function scrollLog() { log.scrollTop = log.scrollHeight; }
  function renderSuggest() {
    $("#suggest").innerHTML = ["suggestion1", "suggestion2", "suggestion3"].map((k) => `<button type="button" class="chip" data-suggest="${k}">${t(k)}</button>`).join("");
  }
  function renderCtx() {
    const box = $("#ctxChip");
    if (!askCtx) { box.hidden = true; box.innerHTML = ""; return; }
    box.hidden = false;
    box.innerHTML = `<span>${t("askingAbout")}: <b>${esc(FH.field(askCtx).label)}</b></span><button type="button" id="ctxClear">${t("clear")}</button>`;
  }
  function send(m) {
    if (thinking) return;
    const msg = { role: "user", ctx: askCtx, ...m };
    chat.push(msg);
    log.insertAdjacentHTML("beforeend", msgHTML(msg));
    thinking = true;
    log.insertAdjacentHTML("beforeend", thinkingHTML());
    $("#sendBtn").disabled = true;
    scrollLog();
    setTimeout(() => {
      const a = { role: "assistant", ctx: msg.ctx, key: msg.key, q: msg.text };
      chat.push(a);
      thinking = false;
      const th = log.querySelector(".thinking");
      if (th) th.remove();
      log.insertAdjacentHTML("beforeend", msgHTML(a));
      $("#sendBtn").disabled = false;
      scrollLog();
    }, 600);
  }
  function askAboutField() {
    if (!FH.state.selectedId) return;
    askCtx = FH.state.selectedId;
    renderCtx();
    setTab("ask");
    $("#chatIn").focus();
  }
  $("#compose").addEventListener("submit", (e) => {
    e.preventDefault();
    const inp = $("#chatIn");
    const text = inp.value.trim();
    if (!text) { inp.focus(); return; }
    inp.value = "";
    send({ text });
  });
  $("#compose").addEventListener("click", (e) => {
    if (e.target.closest("#ctxClear")) { askCtx = null; renderCtx(); $("#chatIn").focus(); }
  });
  $("#suggest").addEventListener("click", (e) => { const b = e.target.closest("[data-suggest]"); if (b) send({ key: b.dataset.suggest }); });
  log.addEventListener("click", (e) => { const b = e.target.closest("[data-ref]"); if (b) FH.select(b.dataset.ref); });

  /* ---------- Shell ---------- */
  function renderLangBtn() {
    const b = $("#langBtn");
    b.textContent = FH.t("langName");
    b.setAttribute("lang", FH.lang === "en" ? "fr" : "en");
    document.title = `${FH.t("brand")} · Paper Route`;
  }
  $("#langBtn").addEventListener("click", () => FH.toggleLang());
  $("#brand").addEventListener("click", (e) => { e.preventDefault(); FH.showView("landing"); });

  function renderAll() {
    FH.applyI18n(document);
    renderLangBtn();
    renderLanding();
    renderRoute();
    renderPlatform();
    renderSign();
    renderChat();
    renderSuggest();
    renderCtx();
  }

  FH.on("lang", renderAll);
  FH.on("doc", renderPlatform);
  FH.on("page", renderStops);
  FH.on("select", () => { updateRoute(true); renderSign(); });

  renderAll();
  FH.mountSheet($("#sheet"));
  FH.select("g-number");

  window.addEventListener("resize", () => placeMarker(false));
  horizontal.addEventListener("change", () => placeMarker(false));
  FH.mountSwitcher((v) => {
    requestAnimationFrame(() => {
      if (v === "workspace") placeMarker(false);
      else renderMap(false);
    });
  });
})();
</script>
</body>
</html>
