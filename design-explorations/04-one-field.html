<!doctype html><html lang="en"><head><meta charset="utf-8">
<!--
DIRECTION CONTRACT · 04 One Field at a Time
THESIS: Anxiety comes from seeing eighty boxes at once. Show one field, huge and calm, like a patient interviewer; the whole form shrinks to a map you can glance at.
OWN-WORLD: A saturated deep-teal rail with on-hue text, a near-white reading room in teal-black ink, and one coral accent reserved for "Next" and the guarantor flag. Bricolage Grotesque display, Figtree body.
STORY: Land, see a real field explained, open a sample. In the workspace, read one field, step forward with the coral Next, glance at the map, and ask the chat when stuck.
FIRST VIEWPORT: Desktop shows the rail map and progress, the giant field name, its meaning, what to enter and the example specimen, with chat open at 1440.
FORM: The facsimile lives as a small live map in the rail; the field explanation is the page.
-->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Form Helper · One field at a time</title>
<link rel="stylesheet" href="shared/form-sheet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Figtree:wght@400..700&display=swap">
<style>
:root {
  --teal: #0b5c63;
  --teal-deep: #084a50;
  --teal-deeper: #063c41;
  --on-teal: #d6f1ef;
  --on-teal-2: #a9dcd8;
  --on-teal-line: rgb(214 241 239 / 0.28);
  --paper: #f7fbfa;
  --white: #ffffff;
  --ink: #0d2224;
  --ink-2: #3d5b5e;
  --line: #cfe3e0;
  --field-line: #5b7f82;
  --tint: #e6f2f0;
  --coral: #e4572e;
  --coral-hover: #ec6a44;
  --on-coral: #1c0a05;
  --display: "Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --shadow: 0 2px 4px rgb(6 60 65 / 0.06), 0 14px 30px -10px rgb(6 60 65 / 0.22);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--body);
  font-size: 1.25rem;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { text-wrap: balance; }
p, li { text-wrap: pretty; }
button { font: inherit; color: inherit; }
a { color: var(--teal); text-underline-offset: 3px; text-decoration-thickness: 1px; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 3px solid var(--teal); outline-offset: 3px; border-radius: 4px; }
.rail :focus-visible, .topbar :focus-visible, .band :focus-visible { outline-color: var(--on-teal); }
.sr-only {
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}
.skip {
  position: absolute; left: 12px; top: -80px; z-index: 100;
  background: var(--ink); color: var(--white); padding: 10px 16px; border-radius: 8px;
}
.skip:focus { top: 12px; }
.ic { width: 1.15em; height: 1.15em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.mobile-only { display: none !important; }

.brand {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--display); font-weight: 800; font-size: 1.25rem;
  letter-spacing: -0.015em; line-height: 1; color: var(--teal);
}
.brand .ic { width: 1.5em; height: 1.5em; }

/* Language toggle */
.lang { display: inline-flex; gap: 2px; padding: 3px; border-radius: 10px; border: 1px solid var(--line); background: var(--white); flex: none; }
.lang button {
  min-width: 44px; min-height: 38px; border: 0; border-radius: 7px; background: transparent;
  color: var(--ink); font: 600 0.9375rem/1 var(--body); cursor: pointer;
}
.lang button:hover { background: var(--tint); }
.lang button[aria-pressed="true"] { background: var(--teal); color: #eefaf8; }
.lang.on-teal { background: var(--teal-deep); border-color: var(--on-teal-line); }
.lang.on-teal button { color: var(--on-teal); }
.lang.on-teal button:hover { background: rgb(214 241 239 / 0.12); }
.lang.on-teal button[aria-pressed="true"] { background: var(--on-teal); color: var(--teal-deeper); }

/* Shared buttons */
.btn-ask {
  display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px;
  border: 1.5px solid var(--teal); border-radius: 10px; background: transparent; color: var(--teal);
  font: 600 1rem/1.2 var(--body); cursor: pointer;
}
.btn-ask:hover { background: var(--tint); }
.pg-btn {
  display: flex; align-items: center; gap: 14px; min-height: 88px; padding: 16px 22px;
  border-radius: 12px; text-align: left; cursor: pointer; font: inherit;
}
.pg-btn .ic { width: 1.5em; height: 1.5em; }
.pg-text { display: grid; gap: 2px; min-width: 0; }
.pg-text small { font-size: 0.9375rem; font-weight: 500; line-height: 1.3; }
.pg-label { font-family: var(--display); font-weight: 700; font-size: 1.375rem; line-height: 1.15; letter-spacing: -0.01em; }
.pg-prev { border: 1.5px solid var(--teal); background: transparent; color: var(--teal); }
.pg-prev:hover:not(:disabled) { background: var(--tint); }
.pg-next {
  border: 0; background: var(--coral); color: var(--on-coral); justify-content: space-between;
  box-shadow: 0 2px 3px rgb(120 40 10 / 0.14), 0 12px 24px -12px rgb(160 50 20 / 0.6);
}
.pg-next:hover:not(:disabled) { background: var(--coral-hover); }
.pg-btn:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }
.pg-ask { display: none; }

/* Specimen (example value) */
.spec { margin: 24px 0 0; padding: 20px 26px 22px; background: var(--white); border: 1px solid var(--line); border-radius: 12px; max-width: 65ch; }
.spec figcaption { font-size: 0.9375rem; color: var(--ink-2); }
.spec-val {
  margin: 4px 0 0; font-family: var(--display); font-weight: 700;
  font-size: clamp(2.5rem, 9cqi, 4.5rem); line-height: 1.05; letter-spacing: 0.01em;
  font-variant-numeric: tabular-nums; overflow-wrap: anywhere;
}
.spec-val.is-long { font-size: clamp(1.6rem, 4.6cqi, 2.5rem); letter-spacing: -0.01em; line-height: 1.15; }
.spec-fmt { margin: 6px 0 0; font-size: 1rem; color: var(--ink-2); font-variant-numeric: tabular-nums; }

/* Breadcrumbs */
.crumbs ol { display: flex; flex-wrap: wrap; gap: 2px 0; list-style: none; padding: 0; margin: 0; font-size: 1rem; color: var(--ink-2); }
.crumbs li + li::before { content: "›" / ""; margin: 0 10px; color: var(--teal); }

/* ---------------- Landing ---------------- */
.l-head {
  display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
  padding: 18px clamp(20px, 6vw, 96px); border-bottom: 1px solid var(--line);
}
.l-notice { margin: 0 auto 0 0; display: inline-flex; align-items: center; gap: 8px; font-size: 0.9375rem; color: var(--ink-2); }
.l-notice .ic { color: var(--teal); }
.l-main { padding: 56px clamp(20px, 6vw, 96px) 88px; outline: none; }
.l-hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(320px, 400px); gap: 72px; align-items: start; }
.l-col { max-width: 820px; }
.l-title {
  font-family: var(--display); font-weight: 800; font-variation-settings: "opsz" 96;
  font-size: clamp(2.6rem, 1.2rem + 4.6vw, 5.5rem); line-height: 0.98; letter-spacing: -0.035em;
  margin: 0; max-width: 16ch;
}
.l-sub { margin: 24px 0 0; font-size: 1.375rem; line-height: 1.5; color: var(--ink-2); max-width: 44ch; }
.l-actions { display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; margin-top: 40px; }
.drop {
  position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
  padding: 26px 28px; min-height: 216px; border: 2px dashed var(--teal); border-radius: 12px;
  background: var(--white); cursor: pointer;
}
.drop:hover, .drop.is-over { background: var(--tint); border-style: solid; }
.drop:focus-within { outline: 3px solid var(--teal); outline-offset: 3px; }
.drop-ic { display: grid; place-items: center; width: 48px; height: 48px; border-radius: 10px; background: var(--tint); color: var(--teal); margin-bottom: 8px; }
.drop-title { font-family: var(--display); font-weight: 700; font-size: 1.625rem; line-height: 1.15; letter-spacing: -0.015em; }
.drop-hint { font-size: 1.0625rem; color: var(--ink); }
.drop-limits { margin-top: auto; padding-top: 10px; font-size: 0.9375rem; line-height: 1.45; color: var(--ink-2); }
.drop-status:not(:empty) { font-size: 0.9375rem; font-weight: 600; color: var(--teal-deep); }
.samples { display: flex; flex-direction: column; gap: 10px; }
.samples-title { margin: 0 0 2px; font-size: 1.0625rem; font-weight: 600; }
.sample {
  display: grid; grid-template-columns: 1fr auto; grid-template-areas: "code arrow" "name arrow";
  align-items: center; gap: 2px 12px; min-height: 84px; padding: 14px 18px; text-align: left;
  background: var(--white); border: 1px solid var(--line); border-radius: 10px; cursor: pointer;
}
.sample:hover { border-color: var(--teal); background: var(--tint); }
.sample-code { grid-area: code; font-size: 0.9375rem; font-weight: 700; color: var(--teal); font-variant-numeric: tabular-nums; }
.sample-name { grid-area: name; font-size: 1.0625rem; font-weight: 600; line-height: 1.3; }
.sample .ic { grid-area: arrow; color: var(--teal); width: 1.4em; height: 1.4em; }
.supported { display: flex; align-items: flex-start; gap: 10px; margin: 22px 0 0; font-size: 1rem; color: var(--ink-2); max-width: 65ch; }
.supported .ic { color: var(--teal); margin-top: 3px; }

.demo { margin: 8px 0 0; container-type: inline-size; }
.demo-card { background: var(--white); border-radius: 12px; padding: 28px 30px 30px; box-shadow: var(--shadow); }
.demo .crumbs ol { font-size: 0.875rem; }
.demo-title {
  font-family: var(--display); font-weight: 800; font-variation-settings: "opsz" 96;
  font-size: clamp(2.5rem, 15cqi, 4rem); line-height: 0.98; letter-spacing: -0.035em; margin: 14px 0 16px;
}
.demo-lead { margin: 0; font-size: 1.375rem; line-height: 1.4; }
.demo-h { margin: 22px 0 4px; font-family: var(--display); font-weight: 700; font-size: 1.125rem; color: var(--teal); }
.demo-enter { margin: 0; font-size: 1.0625rem; color: var(--ink-2); }
.demo .spec { border: 0; border-top: 1px solid var(--line); border-radius: 0; padding: 14px 0 0; margin-top: 18px; }
.demo .spec-val { font-size: clamp(2rem, 11cqi, 3rem); }
.demo .pg-next { width: 100%; min-height: 72px; margin-top: 22px; padding: 12px 18px; }
.demo .pg-label { font-size: 1.25rem; }
.demo figcaption { margin-top: 14px; font-size: 0.9375rem; color: var(--ink-2); max-width: 40ch; }

.finder { margin-top: 104px; max-width: 840px; }
.finder-q {
  font-family: var(--display); font-weight: 800; font-variation-settings: "opsz" 72;
  font-size: clamp(2.25rem, 1rem + 3vw, 3.75rem); line-height: 1.02; letter-spacing: -0.03em; margin: 0;
}
.finder-sub { margin: 16px 0 26px; max-width: 60ch; color: var(--ink-2); }
.finder-sub strong { display: block; color: var(--ink); font-weight: 600; }
.finder-form { display: flex; gap: 12px; }
.finder-form input {
  flex: 1; min-width: 0; min-height: 64px; padding: 0 20px; border: 2px solid var(--teal); border-radius: 10px;
  background: var(--white); color: var(--ink); font: 400 1.1875rem var(--body);
}
.finder-form input::placeholder { color: #4a6568; }
.finder-form button {
  min-height: 64px; padding: 0 24px; border: 0; border-radius: 10px; background: var(--teal); color: #eefaf8;
  font-weight: 600; cursor: pointer; white-space: nowrap;
}
.finder-form button:hover { background: var(--teal-deep); }
.svc-list { list-style: none; margin: 28px 0 0; padding: 0; border-top: 1px solid var(--line); }
.svc {
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 16px;
  padding: 16px 8px; border-bottom: 1px solid var(--line); color: var(--ink); text-decoration: none;
}
.svc:hover { background: var(--tint); }
.svc:hover .svc-name { text-decoration: underline; text-underline-offset: 4px; }
.svc-name { font-weight: 600; font-size: 1.25rem; line-height: 1.3; }
.svc-meta { grid-column: 1; font-size: 0.9375rem; color: var(--ink-2); }
.svc .ic { grid-column: 2; grid-row: 1 / span 2; color: var(--teal); }
.svc-empty { padding: 18px 8px; color: var(--ink-2); border-bottom: 1px solid var(--line); }

.band { background: var(--teal); color: var(--on-teal); padding: 56px clamp(20px, 6vw, 96px) 104px; }
.band-inner { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 40px; max-width: 1240px; }
.band p { margin: 0; display: flex; gap: 12px; font-size: 1.0625rem; line-height: 1.55; }
.band .ic { width: 1.4em; height: 1.4em; margin-top: 1px; color: var(--on-teal); }
.band-foot { margin-top: 44px !important; padding-top: 22px; border-top: 1px solid var(--on-teal-line); color: var(--on-teal-2); font-size: 0.9375rem !important; align-items: center; flex-wrap: wrap; }
.band-foot .brand { color: var(--on-teal); font-size: 1.125rem; margin-right: 12px; }
/* ---------------- Workspace ---------------- */
.ws { display: grid; grid-template-columns: 300px minmax(0, 1fr); height: 100vh; height: 100dvh; }
@media (min-width: 861px) { body[data-view="workspace"] { overflow: hidden; } }
@media (min-width: 1200px) { .ws.chat-open { grid-template-columns: 300px minmax(0, 1fr) 380px; } }
.topbar, .rail-sheet-head, .scrim { display: none; }

.rail {
  background: var(--teal); color: var(--on-teal); padding: 22px 24px 48px;
  display: flex; flex-direction: column; gap: 22px; overflow-y: auto; min-height: 0;
  scrollbar-color: rgb(214 241 239 / 0.35) transparent; font-size: 0.9375rem; line-height: 1.4;
}
.rail .brand { color: var(--on-teal); }
.rail-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: -6px; }
.ghost-btn {
  min-height: 36px; padding: 0 12px; border: 1px solid var(--on-teal-line); border-radius: 8px;
  background: transparent; color: var(--on-teal); font: 600 0.875rem/1.2 var(--body); cursor: pointer;
}
.ghost-btn:hover { background: rgb(214 241 239 / 0.12); }
.rail-meta { margin: 0 0 8px; font-size: 0.875rem; color: var(--on-teal-2); }
.doc-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.doc-tab {
  display: grid; gap: 2px; align-content: start; padding: 10px 12px; text-align: left; border-radius: 10px;
  border: 1px solid transparent; background: var(--teal-deep); color: var(--on-teal); cursor: pointer;
}
.doc-tab:hover { border-color: var(--on-teal-line); }
.doc-num { font-family: var(--display); font-weight: 700; font-size: 0.9375rem; font-variant-numeric: tabular-nums; }
.doc-name { font-size: 0.8125rem; line-height: 1.3; color: var(--on-teal-2); }
.doc-tab[aria-current="true"] { background: var(--paper); color: var(--ink); }
.doc-tab[aria-current="true"] .doc-name { color: var(--ink-2); }
.add-pdf {
  display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; margin-top: 6px;
  border: 1px dashed rgb(214 241 239 / 0.5); border-radius: 10px; font-weight: 600; font-size: 0.875rem; cursor: pointer;
}
.add-pdf:hover { background: rgb(214 241 239 / 0.1); }
.add-pdf:focus-within { outline: 3px solid var(--on-teal); outline-offset: 2px; }
.rail-status:not(:empty) { margin: 6px 0 0; font-size: 0.8125rem; color: var(--on-teal-2); }

.map-box {
  position: relative; width: 100%; height: 326px; overflow: hidden; border-radius: 6px; background: var(--white);
  box-shadow: 0 2px 4px rgb(0 0 0 / 0.14), 0 16px 30px -12px rgb(0 18 20 / 0.55);
}
#mapInner { position: absolute; top: 0; left: 0; width: 520px; transform: scale(var(--s, 0.4846)); transform-origin: 0 0; }
.map-box .form-sheet {
  --fs-paper: #ffffff; --fs-ink: #0d2224; --fs-rule: #5b7477; --fs-bar: #0d2224; --fs-bar-ink: #ffffff;
  --fs-font: "Arial", "Helvetica Neue", Helvetica, sans-serif;
  --ff-ring: var(--coral); --ff-tint: rgb(228 87 46 / 0.16); --ff-hover: rgb(11 92 99 / 0.1);
  --ff-visited-mark: var(--teal); --ff-radius: 2px;
}
.map-box .ff.is-selected { box-shadow: inset 0 0 0 6px var(--coral); }
.map-box .ff.is-visited::after { width: 12px; height: 12px; top: 6px; right: 6px; }
.map-box .ff:focus-visible { outline: 6px solid var(--teal-deeper); outline-offset: 2px; }
.pages { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; list-style: none; padding: 0; margin: 10px 0 0; }
.pg-num {
  width: 100%; min-height: 36px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  border: 0; border-radius: 6px; background: var(--teal-deep); color: var(--on-teal);
  font: 600 0.875rem/1 var(--body); font-variant-numeric: tabular-nums; cursor: pointer;
}
.pg-num:hover { background: var(--teal-deeper); }
.pg-num.has-fields::after { content: ""; width: 4px; height: 4px; margin-top: 3px; border-radius: 50%; background: currentColor; }
.pg-num[aria-current="page"] { background: var(--paper); color: var(--ink); }

.fl-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.fl-head h2 { margin: 0; font-size: 1rem; font-weight: 600; }
.fl-head span { font-size: 0.8125rem; color: var(--on-teal-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.fl-sec-title { margin: 18px 0 6px; font-size: 0.8125rem; font-weight: 600; color: var(--on-teal-2); }
.fl-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.fl-item {
  width: 100%; display: grid; grid-template-columns: 20px 1fr auto; gap: 10px; align-items: center;
  padding: 7px 8px; border: 0; border-radius: 8px; background: transparent; color: var(--on-teal);
  font: 400 0.9375rem/1.3 var(--body); text-align: left; cursor: pointer;
}
.fl-item:hover { background: rgb(214 241 239 / 0.1); }
.fl-check { display: grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--on-teal-2); }
.fl-check .ic { width: 12px; height: 12px; stroke-width: 3; }
.fl-item.is-visited .fl-check { background: var(--on-teal); border-color: var(--on-teal); color: var(--teal-deeper); }
.fl-pg { font-size: 0.75rem; color: var(--on-teal-2); font-variant-numeric: tabular-nums; }
.fl-flag { display: inline-block; width: 8px; height: 8px; margin-left: 8px; border-radius: 2px; background: var(--coral); vertical-align: middle; }
.fl-item[aria-current="true"] { background: var(--paper); color: var(--ink); font-weight: 600; }
.fl-item[aria-current="true"] .fl-pg { color: var(--ink-2); }
.fl-item[aria-current="true"] .fl-check { border-color: var(--teal); }
.fl-item[aria-current="true"].is-visited .fl-check { background: var(--teal); color: #eefaf8; }

.reading { overflow-y: auto; min-height: 0; padding: 0 clamp(24px, 4vw, 56px) 120px; outline: none; }
.reading-top {
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
  max-width: 800px; padding: 16px 0; border-bottom: 1px solid var(--line);
}
.notice { margin: 0; display: inline-flex; align-items: center; gap: 8px; font-size: 0.9375rem; line-height: 1.35; color: var(--ink-2); }
.notice .ic { color: var(--teal); }
.tool-btn {
  display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; flex: none;
  border: 1px solid var(--line); border-radius: 10px; background: var(--white); color: var(--teal);
  font: 600 1rem/1.2 var(--body); cursor: pointer;
}
.tool-btn:hover { border-color: var(--teal); }
.tool-btn[aria-expanded="true"] { background: var(--tint); border-color: var(--teal); }
.reading-inner { max-width: 800px; container-type: inline-size; padding-top: 40px; }

.f-title {
  font-family: var(--display); font-weight: 800; font-variation-settings: "opsz" 96;
  font-size: clamp(2.25rem, 10cqi, 5.5rem); line-height: 0.98; letter-spacing: -0.035em;
  margin: 22px 0 0; hyphens: auto; overflow-wrap: break-word; outline: none;
}
.f-title.is-prompt { font-size: clamp(2rem, 7cqi, 4rem); line-height: 1.05; max-width: 18ch; }
.f-pre { display: block; font-size: 0.42em; font-weight: 700; letter-spacing: -0.01em; color: var(--teal); margin-bottom: 0.2em; font-variation-settings: "opsz" 36; }
.f-flags { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 26px; }
.flag-g {
  margin: 0; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px;
  border-radius: 10px; background: var(--coral); color: var(--on-coral); font-weight: 600; font-size: 1rem;
}
.f-sec { margin-top: 48px; }
.f-sec > h2 {
  margin: 0 0 10px; font-family: var(--display); font-weight: 700; font-variation-settings: "opsz" 32;
  font-size: 1.375rem; line-height: 1.2; letter-spacing: -0.01em; color: var(--teal);

    fileNote: "{name} : dans ce prototype, le formulaire exemple s'ouvre à la place.",
    fileBad: "Veuillez choisir un fichier PDF.",
    addNote: "{name} : dans ce prototype, seuls les deux documents exemples s'ouvrent.",
    noResults: "Aucun service correspondant pour l'instant. Essayez passeport, emploi, enfants ou pension.",
    svcCount: "{n} services correspondants",
    opensNew: "(s'ouvre dans un nouvel onglet)",
    firstField: "C'est le premier champ",
    lastField: "C'est le dernier champ",
    startWith: "Commencer par le premier champ",
    emptyLead: "Une case à la fois. Choisissez un champ sur la carte, ou commencez au début et utilisez Suivant.",
    visitedOne: "consulté",
    noSources: "Aucune page officielle n'est encore liée à ce champ.",
  });

  /* ---- Simple drawn icons ---- */
  const ICONS = {
    arrowL: '<path d="M19 12H5M11 6l-6 6 6 6"/>',
    arrowR: '<path d="M5 12h14M13 6l6 6-6 6"/>',
    check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    chat: '<path d="M4 5.5h16v10.5H9.5L4 20z"/>',
    map: '<path d="M4 6.5l5-2 6 2 5-2v13l-5 2-6-2-5 2z"/><path d="M9 4.5v13M15 6.5v13"/>',
    close: '<path d="M6 6l12 12M18 6L6 18"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.6v.2"/>',
    lock: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
    ai: '<circle cx="12" cy="12" r="3.5"/><path d="M12 3v4M12 17v4M3 12h4M17 12h4"/>',
    upload: '<path d="M12 15V4M7 9l5-5 5 5M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/>',
    ext: '<path d="M14 5h5v5M19 5l-8 8M18 14v5H5V6h5"/>',
    pen: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',
    book: '<path d="M4 5h6a2 2 0 0 1 2 2v12a2 2 0 0 0-2-2H4z"/><path d="M20 5h-6a2 2 0 0 0-2 2v12a2 2 0 0 1 2-2h6z"/>',
    mark: '<rect x="3" y="3" width="18" height="18" rx="5"/><path d="M7.5 15.5h9"/><circle cx="8.6" cy="9.2" r="1.7" fill="currentColor" stroke="none"/>',
  };
  const svg = (name) => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false">${ICONS[name] || ""}</svg>`;

  /* ---- State owned by this design ---- */
  const mqWide = matchMedia("(min-width: 1400px)");
  const mqMobile = matchMedia("(max-width: 860px)");
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");
  const ws = $("#ws");
  let chatOpen = mqWide.matches;
  let chatLog = [{ type: "seed" }];
  let ctxId = null;
  let busy = false;
  let railOpen = false;
  let lastRenderedId = null;
  let booted = false;
  let chatReturn = null;
  let dropStatus = null;
  let addStatus = null;

  const splitEx = (s) => {
    const m = String(s).match(/^(.*?)\s*\(([^)]+)\)$/);
    return m ? { val: m[1], fmt: m[2] } : { val: String(s), fmt: "" };
  };
  const specimen = (ex) => {
    const { val, fmt } = splitEx(ex);
    return `<figure class="spec"><figcaption>${esc(t("example"))}</figcaption><p class="spec-val ${val.length > 14 ? "is-long" : ""}">${esc(val)}</p>${fmt ? `<p class="spec-fmt">${esc(fmt)}</p>` : ""}</figure>`;
  };
  const titleHTML = (label) => {
    const m = label.match(/^(.+?\s?:)\s(.+)$/);
    return m ? `<span class="f-pre">${esc(m[1])}</span> ${esc(m[2])}` : esc(label);
  };

  /* ---- Focus continuity when regions re-render ---- */
  let lastFocus = null;
  const KEYS = ["goto", "step", "page", "doc", "lang", "suggest", "start", "ask", "field"];
  document.addEventListener("focusin", (e) => {
    const el = e.target;
    if (!(el instanceof HTMLElement)) return;
    let sel = el.id ? `#${el.id}` : null;
    if (!sel) for (const k of KEYS) if (k in el.dataset) { sel = el.dataset[k] ? `[data-${k}="${el.dataset[k]}"]` : `[data-${k}]`; break; }
    const region = el.closest("[data-region]");
    lastFocus = sel ? { region: region ? region.dataset.region : null, sel } : null;
  });
  function restoreFocus() {
    const a = document.activeElement;
    if (a && a !== document.body && a.isConnected) return;
    let target = null;
    if (lastFocus) {
      const root = lastFocus.region ? document.querySelector(`[data-region="${lastFocus.region}"]`) : document;
      target = root && root.querySelector(lastFocus.sel);
    }
    if (target && !target.disabled && target.offsetParent !== null) target.focus({ preventScroll: true });
    else if (document.body.dataset.view === "workspace") {
      const h = $("#fTitle");
      if (h) h.focus({ preventScroll: true });
    }
  }
  /* ---------------- Renderers ---------------- */
  function renderLangToggles() {
    $$("[data-lang]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.lang === FH.lang)));
    document.title = t("docTitle");
  }

  function renderDocs() {
    $("#docTabs").innerHTML = D.docs.map((d) => `
      <button type="button" class="doc-tab" data-doc="${d.id}" ${d.id === FH.state.docId ? 'aria-current="true"' : ""}>
        <span class="doc-num">${esc(d.number)}</span><span class="doc-name">${esc(d.short[FH.lang])}</span>
      </button>`).join("");
    $("#docCount").textContent = t("docsCount", { n: D.docs.length });
    $("#addStatus").textContent = addStatus ? t(addStatus.key, addStatus.vars) : "";
  }

  const PAGES_WITH_FIELDS = new Set(D.fields.map((f) => f.page));
  function renderPages() {
    const n = FH.doc().pages;
    $("#pages").innerHTML = Array.from({ length: n }, (_, i) => i + 1).map((p) => `
      <li><button type="button" class="pg-num ${PAGES_WITH_FIELDS.has(p) ? "has-fields" : ""}" data-page="${p}"
        aria-label="${esc(t("page"))} ${p} ${esc(t("of"))} ${n}" ${p === FH.state.page ? 'aria-current="page"' : ""}>${p}</button></li>`).join("");
  }

  function renderFieldList() {
    const visited = FH.state.visited;
    const sel = FH.state.selectedId;
    $("#flCount").textContent = `${visited.size}/${TOTAL} ${t("viewed")}`;
    $("#flBody").innerHTML = FH.sectionsInOrder().map((s) => `
      <div class="fl-sec">
        <h3 class="fl-sec-title">${esc(s.label)}</h3>
        <ol class="fl-list">${s.fields.map((f) => {
          const v = visited.has(f.id);
          return `<li><button type="button" class="fl-item ${v ? "is-visited" : ""}" data-goto="${f.id}" ${f.id === sel ? 'aria-current="true"' : ""}>
            <span class="fl-check" aria-hidden="true">${v ? svg("check") : ""}</span>
            <span class="fl-label">${esc(f.label)}${f.bold ? `<span class="fl-flag" aria-hidden="true"></span><span class="sr-only"> (${esc(t("required"))})</span>` : ""}${v ? `<span class="sr-only"> (${esc(t("visitedOne"))})</span>` : ""}</span>
            <span class="fl-pg" aria-hidden="true">p.${f.page}</span>
          </button></li>`;
        }).join("")}</ol>
      </div>`).join("");
  }

  function renderTopbar() {
    const f = FH.state.selectedId ? FH.field(FH.state.selectedId) : null;
    $("#tbPos").textContent = f ? `${f.index + 1}/${TOTAL}` : `–/${TOTAL}`;
  }

  function renderMain(animate) {
    const host = $("#fieldHost");
    const doc = FH.doc();
    const f = FH.state.selectedId ? FH.field(FH.state.selectedId) : null;

    if (!f) {
      host.innerHTML = `
        <nav class="crumbs" aria-label="${esc(t("where"))}"><ol>
          <li>${esc(doc.number)}</li><li>${esc(t("page"))} ${FH.state.page} ${esc(t("of"))} ${doc.pages}</li>
        </ol></nav>
        <h1 class="f-title is-prompt" id="fTitle" tabindex="-1">${esc(t("selectPrompt"))}</h1>
        <p class="f-lead empty-lead">${esc(t("emptyLead"))}</p>
        <div class="empty-actions">
          <button type="button" class="pg-btn pg-next" data-start>
            <span class="pg-text"><small>${esc(t("startWith"))}</small><span class="pg-label">${esc(FH.field(D.fields[0].id).label)}</span></span>${svg("arrowR")}
          </button>
          <button type="button" class="btn-ask mobile-only" data-rail-open>${svg("map")}${esc(t("map"))}</button>
        </div>`;
      lastRenderedId = null;
      return;
    }

    const ids = D.fields.map((x) => x.id);
    const prev = f.index > 0 ? FH.field(ids[f.index - 1]) : null;
    const next = f.index < ids.length - 1 ? FH.field(ids[f.index + 1]) : null;
    const sec = (id, heading, inner) => `<section class="f-sec" aria-labelledby="h-${id}"><h2 id="h-${id}">${esc(heading)}</h2>${inner}</section>`;

    host.innerHTML = `
      <nav class="crumbs" aria-label="${esc(t("where"))}"><ol>
        <li>${esc(doc.number)}</li>
        <li>${esc(t("page"))} ${f.page}</li>
        <li>${esc(f.sectionLabel)}</li>
        <li>${esc(t("fieldPos", { i: f.index + 1, n: TOTAL }))}</li>
      </ol></nav>
      <h1 class="f-title" id="fTitle" tabindex="-1">${titleHTML(f.label)}</h1>
      <div class="f-flags">
        ${f.bold ? `<p class="flag-g">${svg("pen")}${esc(t("required"))}</p>` : ""}
        <button type="button" class="btn-ask" data-ask>${svg("chat")}${esc(t("askField"))}</button>
      </div>
      ${f.meaning ? `<section class="f-sec f-lead-sec" id="fLead" aria-labelledby="h-meaning"><h2 id="h-meaning">${esc(t("meaning"))}</h2><p class="f-lead">${esc(f.meaning)}</p></section>` : ""}
      ${f.enter ? sec("enter", t("enter"), `<p>${esc(f.enter)}</p>${f.example ? specimen(f.example) : ""}`) : ""}
      ${f.options ? sec("options", t("options"), `<ul class="opts">${f.options.map((o) => `<li><span class="opt-box" aria-hidden="true"></span>${esc(o)}</li>`).join("")}</ul>`) : ""}
      ${f.find ? sec("find", t("find"), `<p>${esc(f.find)}</p>`) : ""}
      ${f.mistakes.length ? sec("mistakes", t("mistakes"), `<ul class="mist">${f.mistakes.map((m) => `<li>${esc(m)}</li>`).join("")}</ul>`) : ""}
      ${f.points ? sec("points", f.points.title, `<ul class="pts">${f.points.items.map((m) => `<li>${esc(m)}</li>`).join("")}</ul>`) : ""}
      ${sec("sources", t("sources"), `${f.sources.length ? FH.sourceList(f.sources, "src") : `<p class="no-src">${esc(t("noSources"))}</p>`}
        <p class="grounded ${f.grounded ? "" : "is-general"}">${svg(f.grounded ? "book" : "info")}${esc(f.grounded ? t("grounded") : t("general"))}</p>`)}
      <nav class="pager" aria-label="${esc(t("fieldNav"))}">
        <button type="button" class="pg-btn pg-prev" data-step="-1" ${prev ? "" : "disabled"}>
          ${svg("arrowL")}<span class="pg-text"><small>${esc(t("prev"))}</small><span class="pg-label">${esc(prev ? prev.label : t("firstField"))}</span></span>
        </button>
        <button type="button" class="pg-btn pg-ask" data-ask>${svg("chat")}<span>${esc(t("ask"))}</span></button>
        <button type="button" class="pg-btn pg-next" data-step="1" ${next ? "" : "disabled"}>
          <span class="pg-text"><small>${esc(t("next"))}</small><span class="pg-label">${esc(next ? next.label : t("lastField"))}</span></span>${svg("arrowR")}
        </button>
      </nav>`;

    if (animate && lastRenderedId && lastRenderedId !== f.id && !reduceMotion.matches && host.animate) {
      [$("#fTitle"), $("#fLead")].filter(Boolean).forEach((el) => el.animate(
        [
          { opacity: 0.35, transform: "translateY(12px)", clipPath: "inset(0 0 24% 0)" },
          { opacity: 1, transform: "translateY(0)", clipPath: "inset(0 0 0 0)" },
        ],
        { duration: 220, easing: "cubic-bezier(0.16, 1, 0.3, 1)" }
      ));
    }
    lastRenderedId = f.id;
  }

  /* ---- Chat ---- */
  function botReply(e) {
    const q = e.key ? t(e.key) : e.text;
    let r = FH.reply(q);
    const generic = !r.refs.length && r.sources[0] && r.sources[0].id === "passports";
    if (e.ctx && generic) r = FH.reply(`${q} ${FH.field(e.ctx).label}`);
    return r;
  }
  function msgHTML(m) {
    if (m.role === "user") {
      return `<div class="msg user"><p>${esc(m.text)}</p>${m.ctx ? `<small>${esc(t("askingAbout"))}: ${esc(m.ctx)}</small>` : ""}</div>`;
    }
    const by = `<p class="msg-by">${svg("mark")}${esc(t("brand"))}</p>`;
    if (m.kind === "overview") {
      const o = m.overview;
      return `<article class="msg bot ov">${by}
        <h3>${esc(t("overviewTitle"))}</h3>
        <p class="ov-title">${esc(o.title)}</p><p class="ov-dept">${esc(o.department)}</p>
        <p>${esc(o.summary)}</p>
        <h4>${esc(t("who"))}</h4><p>${esc(o.who)}</p>
        <h4>${esc(t("need"))}</h4><ul>${o.need.map((n) => `<li>${esc(n)}</li>`).join("")}</ul>
        <h4>${esc(t("submit"))}</h4><p>${esc(o.submit)}</p>
        <h4>${esc(t("sources"))}</h4>${FH.sourceList(o.sources, "csrc")}
      </article>`;
    }
    return `<article class="msg bot">${by}
      <p>${esc(m.text)}</p>
      ${m.list ? `<ul>${m.list.map((x) => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
      ${m.refs && m.refs.length ? `<div class="refs">${m.refs.map((id) => `<button type="button" class="ref-chip" data-goto="${id}">${esc(FH.field(id).label)}</button>`).join("")}</div>` : ""}
      ${m.sources && m.sources.length ? FH.sourceList(m.sources, "csrc") : ""}
      <small class="proto-tag">${esc(t("protoReply"))}</small>
    </article>`;
  }
  function renderChat(scrollEnd) {
    const log = $("#chatLog");
    let html = "";
    chatLog.forEach((e) => {
      if (e.type === "seed") html += FH.seedChat().map(msgHTML).join("");
      else if (e.type === "user") html += msgHTML({ role: "user", text: e.key ? t(e.key) : e.text, ctx: e.ctx ? FH.field(e.ctx).label : "" });
      else if (e.type === "bot") html += msgHTML({ role: "assistant", ...botReply(e) });
      else if (e.type === "thinking") html += `<p class="msg thinking" role="status"><span class="dot" aria-hidden="true"></span>${esc(t("thinking"))}</p>`;
    });
    const keep = log.scrollTop;
    log.innerHTML = html;
    log.setAttribute("aria-busy", String(busy));
    log.scrollTop = scrollEnd ? log.scrollHeight : keep;
    $("#suggest").innerHTML = ["suggestion1", "suggestion2", "suggestion3"].map((k) =>
      `<button type="button" class="sg-chip" data-suggest="${k}" ${busy ? "disabled" : ""}>${esc(t(k))}</button>`).join("");
    const ctx = $("#ctx");
    if (ctxId) {
      ctx.hidden = false;
      ctx.innerHTML = `<span>${esc(t("askingAbout"))}: <strong>${esc(FH.field(ctxId).label)}</strong></span><button type="button" class="ctx-clear" data-ctx-clear>${esc(t("clear"))}</button>`;
    } else {
      ctx.hidden = true;
      ctx.innerHTML = "";
    }
    $("#chatSend").disabled = busy;
  }
  function send(text, key) {
    if (busy) return;
    const entry = { text, key, ctx: ctxId };
    chatLog.push({ type: "user", ...entry }, { type: "thinking" });
    busy = true;
    renderChat(true);
    setTimeout(() => {
      chatLog = chatLog.filter((e) => e.type !== "thinking");
      chatLog.push({ type: "bot", ...entry });
      busy = false;
      renderChat(true);
      const a = document.activeElement;
      if ((!a || a === document.body) && chatOpen) $("#chatInput").focus({ preventScroll: true });
    }, 600);
  }

  /* ---- Landing ---- */
  function renderDemo() {
    const f = FH.field("dob");
    const n = FH.field("sex");
    const doc = D.docs.find((d) => d.lang === FH.lang) || D.docs[0];
    $("#demo").innerHTML = `
      <nav class="crumbs" aria-label="${esc(t("where"))}"><ol>
        <li>${esc(doc.number)}</li><li>${esc(t("page"))} ${f.page}</li><li>${esc(f.sectionLabel)}</li>
      </ol></nav>
      <h2 class="demo-title">${esc(f.label)}</h2>
      <p class="demo-lead">${esc(f.meaning)}</p>
      <h3 class="demo-h">${esc(t("enter"))}</h3>
      <p class="demo-enter">${esc(f.enter)}</p>
      ${specimen(f.example)}
      <button type="button" class="pg-btn pg-next" data-demo-next>
        <span class="pg-text"><small>${esc(t("next"))}</small><span class="pg-label">${esc(n.label)}</span></span>${svg("arrowR")}
      </button>`;
    $("#dropStatus").textContent = dropStatus ? t(dropStatus.key, dropStatus.vars) : "";
  }

  const STOP = new Set(["the", "and", "for", "my", "get", "need", "want", "with", "how", "what", "mon", "mes", "les", "des", "une", "pour", "veux", "avec", "comment"]);
  function renderServices() {
    const q = $("#svcInput").value.trim().toLowerCase();
    const words = q.split(/[^\p{L}\p{N}]+/u).filter((w) => w.length > 2 && !STOP.has(w));
    const list = D.services.filter((s) => {
      if (!words.length) return true;
      const r = D.resources[s.id];
      const hay = [s.en, s.fr, s.dept, r.en, r.fr].join(" ").toLowerCase();
      return words.some((w) => hay.includes(w) || (w.length > 5 && hay.includes(w.slice(0, 5))));
    });
    $("#svcList").innerHTML = list.length
      ? list.map((s) => {
          const r = FH.resource(s.id);
          return `<li><a class="svc" href="${r.url}" target="_blank" rel="noopener">
            <span class="svc-name">${esc(s[FH.lang])}</span>
            <span class="svc-meta">${esc(s.dept)} · ${esc(r.title)}${r.note ? ` · ${esc(r.note)}` : ""}<span class="sr-only"> ${esc(t("opensNew"))}</span></span>
            ${svg("ext")}</a></li>`;
        }).join("")
      : `<li class="svc-empty">${esc(t("noResults"))}</li>`;
    $("#svcStatus").textContent = q ? (list.length ? t("svcCount", { n: list.length }) : t("noResults")) : "";
  }

  function renderAll() {
    renderLangToggles();
    renderDocs();
    renderPages();
    renderFieldList();
    renderMain(false);
    renderTopbar();
    renderChat(false);
    renderDemo();
    renderServices();
  }
  /* ---------------- Panels (chat, mobile map sheet) ---------------- */
  function updateOverlay() {
    const m = mqMobile.matches;
    const any = m && (chatOpen || railOpen);
    document.body.classList.toggle("overlay-open", any);
    document.body.classList.toggle("rail-open", m && railOpen);
    $("#reading").inert = any;
    $("#topbar").inert = any;
    const rail = $("#rail");
    if (m && railOpen) { rail.setAttribute("role", "dialog"); rail.setAttribute("aria-modal", "true"); }
    else { rail.removeAttribute("role"); rail.removeAttribute("aria-modal"); }
    rail.inert = m && chatOpen && !railOpen;
    const chat = $("#chat");
    if (m && chatOpen) { chat.setAttribute("role", "dialog"); chat.setAttribute("aria-modal", "true"); }
    else { chat.removeAttribute("role"); chat.removeAttribute("aria-modal"); }
  }
  function setChat(open, focus) {
    chatOpen = open;
    ws.classList.toggle("chat-open", open);
    $$("[data-chat-toggle]").forEach((b) => b.setAttribute("aria-expanded", String(open)));
    updateOverlay();
    if (!focus) return;
    if (open) $("#chatInput").focus({ preventScroll: true });
    else if (chatReturn && chatReturn.isConnected && chatReturn.offsetParent !== null) chatReturn.focus({ preventScroll: true });
    else { const h = $("#fTitle"); if (h) h.focus({ preventScroll: true }); }
  }
  function setRail(open, focus) {
    railOpen = open;
    $("#rail").classList.toggle("is-open", open);
    $("#mapBtn").setAttribute("aria-expanded", String(open));
    updateOverlay();
    if (focus === "title") { const h = $("#fTitle"); if (h) h.focus({ preventScroll: true }); }
    else if (focus) (open ? $("#railClose") : $("#mapBtn")).focus({ preventScroll: true });
  }
  mqMobile.addEventListener("change", () => {
    if (!mqMobile.matches && railOpen) setRail(false);
    updateOverlay();
  });

  /* ---------------- Events ---------------- */
  document.addEventListener("click", (e) => {
    const b = e.target.closest("button, .scrim");
    if (!b) return;
    const d = b.dataset;
    if (d.lang) FH.setLang(d.lang);
    else if (d.goto) {
      const fromChat = !!b.closest("#chat");
      FH.select(d.goto);
      if (fromChat && mqMobile.matches) setChat(false);
    }
    else if (d.step) FH.step(Number(d.step));
    else if (d.page) FH.setPage(Number(d.page));
    else if (d.doc) FH.setDoc(d.doc);
    else if (d.sample) { FH.setDoc(d.sample); FH.showView("workspace"); }
    else if ("demoNext" in d) { FH.select("dob"); FH.select("sex"); FH.showView("workspace"); }
    else if ("start" in d) FH.step(1);
    else if ("ask" in d) {
      ctxId = FH.state.selectedId;
      renderChat(false);
      chatReturn = b;
      setChat(true, true);
    }
    else if ("chatToggle" in d) { chatReturn = b; setChat(!chatOpen, true); }
    else if ("chatClose" in d) setChat(false, true);
    else if ("ctxClear" in d) { ctxId = null; renderChat(false); $("#chatInput").focus(); }
    else if (d.suggest) send(t(d.suggest), d.suggest);
    else if ("railOpen" in d) setRail(true, true);
    else if ("railClose" in d) setRail(false, true);
    else if ("newSession" in d) {
      FH.state.visited.clear();
      chatLog = [{ type: "seed" }];
      ctxId = null;
      renderChat(false);
      FH.select(null);
      FH.setPage(1);
      renderFieldList();
    }
  });

  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if (mqMobile.matches && railOpen) setRail(false, true);
    else if (chatOpen && (mqMobile.matches || $("#chat").contains(document.activeElement))) setChat(false, true);
  });

  $("#chatForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const input = $("#chatInput");
    const v = input.value.trim();
    if (!v || busy) return;
    input.value = "";
    send(v);
  });

  $("#svcForm").addEventListener("submit", (e) => { e.preventDefault(); renderServices(); });
  $("#svcInput").addEventListener("input", renderServices);

  const isPdf = (f) => f && (/\.pdf$/i.test(f.name) || f.type === "application/pdf");
  function landingFiles(files) {
    const f = files && files[0];
    if (!f) return;
    if (!isPdf(f)) { dropStatus = { key: "fileBad" }; renderDemo(); return; }
    dropStatus = { key: "fileNote", vars: { name: f.name } };
    renderDemo();
    setTimeout(() => { FH.setDoc("pptc153"); FH.showView("workspace"); }, 1400);
  }
  const drop = $("#drop");
  $("#pdfInput").addEventListener("change", (e) => landingFiles(e.target.files));
  ["dragenter", "dragover"].forEach((ev) => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add("is-over"); }));
  ["dragleave", "drop"].forEach((ev) => drop.addEventListener(ev, () => drop.classList.remove("is-over")));
  drop.addEventListener("drop", (e) => { e.preventDefault(); landingFiles(e.dataTransfer && e.dataTransfer.files); });
  $("#addInput").addEventListener("change", (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    addStatus = isPdf(f) ? { key: "addNote", vars: { name: f.name } } : { key: "fileBad" };
    e.target.value = "";
    renderDocs();
  });

  /* ---- Mini-map: render the facsimile at 520px and scale it to the rail ---- */
  const mapBox = $("#mapBox");
  const BASE = 520;
  const fitMap = () => {
    const w = mapBox.clientWidth;
    if (!w) return;
    const s = w / BASE;
    mapBox.style.setProperty("--s", s.toFixed(4));
    mapBox.style.height = `${Math.round(BASE * (11 / 8.5) * s)}px`;
  };
  if ("ResizeObserver" in window) new ResizeObserver(fitMap).observe(mapBox);

  /* ---------------- Boot ---------------- */
  $$("[data-icon]").forEach((el) => { el.outerHTML = svg(el.dataset.icon); });
  FH.mountSheet($("#mapInner"), { compact: true });

  FH.on("select", (f) => {
    renderFieldList();
    renderMain(true);
    renderTopbar();
    $("#announce").textContent = f ? f.label : t("selectPrompt");
    if (booted) {
      if (mqMobile.matches) window.scrollTo(0, 0);
      else $("#reading").scrollTop = 0;
      const cur = $('#flBody [aria-current="true"]');
      if (cur && !mqMobile.matches) cur.scrollIntoView({ block: "nearest" });
    }
    if (railOpen && mqMobile.matches) setRail(false, "title");
    restoreFocus();
  });
  FH.on("page", () => { renderPages(); restoreFocus(); });
  FH.on("doc", () => { renderDocs(); renderPages(); restoreFocus(); });
  FH.on("lang", () => { renderAll(); restoreFocus(); });

  ["surname", "given", "dob", "g-surname"].forEach((id) => FH.state.visited.add(id));
  FH.applyI18n(document);
  renderAll();
  setChat(chatOpen, false);
  FH.select("g-number");
  booted = true;
  fitMap();

  FH.mountSwitcher((v) => {
    if (railOpen) setRail(false);
    if (v === "workspace") requestAnimationFrame(fitMap);
  });
})();
</script>
</body>
</html>
